/* quem recebe a confirmação de crédito: membros ativos que criam pagamentos (D55, D58) */
function mailTeam(){return S.team.filter(m=>m.status==='Active'&&RANK[m.role]>=1&&(!single()||m.role==='owner')).map(m=>m.email);}
function mailCandidates(kind){return S.txs.filter(t=>t.kind==='payment'&&!DONE_BAD.includes(t.status)&&!PRE.includes(t.status)&&(kind==='team'||t.email));}
function vEmail(r){
  const kind=(r.params.get('kind')||S.mailKind)==='team'?'team':'ben';S.mailKind=kind;
  const list=mailCandidates(kind);if(!list.length)return '<div class="mailv"><p class="muted">No payment with an email yet.</p></div>';
  let id=r.params.get('tx')||S.mailTx;if(!list.find(t=>t.id===id))id=(list.find(t=>t.status==='Credited')||list[0]).id;S.mailTx=id;
  const t=txById(id),b=ben(t.ben),sw=b.m==='SWIFT',cr=t.status==='Credited',when=cr?t.st.credited:null;
  const opts=list.map(x=>[x.id,ben(x.ben).name+' · '+money(x.dest,x.cur,{code:true})+' · '+x.status]);
  const tabs='<div class="seg" role="tablist" aria-label="Email">'+[['ben','Beneficiary receipt'],['team','Credit confirmation (team)']].map(([k,l])=>'<button type="button" role="tab" aria-selected="'+(kind===k)+'" class="'+(kind===k?'on':'')+'" data-act="mailKind" data-v="'+k+'">'+l+'</button>').join('')+'</div>';
  const trk=sw?'<div data-pt="P3"><span class="k">UETR</span><span class="v mono" style="font-size:12.5px">'+(t.uetr||'Assigned when sent')+'</span></div>':'<div data-pt="P3"><span class="k">Tracking reference</span><span class="v mono" style="font-size:12.5px">'+(t.track||'Assigned when sent')+'</span></div>';
  const top='<div class="mailv"><div class="mail-tools">'+tabs+pnote('mail','Pré-visualização dos e-mails automáticos.',selBox('mail-sel','mailTx',id,opts,'Pagamento')+(cr?'':' Este pagamento ainda não foi creditado: o e-mail sai no momento do crédito.'))+'</div>';
  const foot='<span>Orval Finance. This is an automated message. Orval will never ask for your password or bank details by email.</span>';
  if(kind==='team')return top+
  '<div class="mail-client" data-pt="D55"><div class="mail-meta"><span>From</span><span>Orval &lt;notifications@orval.example&gt;</span><span>To</span><span>'+mailTeam().map(esc).join(', ')+'</span><span>Subject</span><span><b>Credited: '+money(t.dest,t.cur,{code:true})+' to '+esc(b.name)+'</b></span><span>Date</span><span>'+(when?fdt(when):'Sent when credited')+'</span></div>'+
  '<div class="mail-body"><div class="mail"><div class="mail-top">'+logoSvg('#FFFFFF','logo')+'</div><div class="mail-in"><h1>Your payment was credited</h1><p class="muted mt8">The bank of '+esc(b.name)+' confirmed the credit'+(when?' on '+fd(when):'')+'. You can download the receipt in Orval.</p>'+
  '<div class="mail-amt">'+money(t.dest,t.cur,{code:true})+'</div><p class="hint">Credited to '+esc(b.bank)+' '+esc(b.acct)+'</p>'+
  '<div class="dl mt16"><div><span class="k">Beneficiary</span><span class="v">'+esc(b.name)+'</span></div><div><span class="k">From your balance</span><span class="v mono">'+money(ttot(t))+'</span></div>'+
  (t.by?'<div><span class="k">Created by</span><span class="v">'+esc(t.by)+'</span></div>':'')+(apprOf(t).length?'<div><span class="k">Approved by</span><span class="v">'+apprOf(t).map(a=>esc(a.name)).join(', ')+'</span></div>':'')+
  '<div><span class="k">Reference</span><span class="v">'+(t.ref?esc(t.ref):'None')+'</span></div>'+trk+'</div>'+
  '<button type="button" class="btn btn-primary btn-lg btn-block mt20" data-act="toast" data-msg="Protótipo: abriria o pagamento no Orval">View payment in Orval</button>'+
  '<p class="hint mt16">You get this email because you can create payments for Importadora Guaraní S.A.</p></div>'+
  '<div class="mail-foot">'+foot+'</div></div></div></div></div>';
  return top+
  '<div class="mail-client" data-pt="D10"><div class="mail-meta"><span>From</span><span>Orval on behalf of Importadora Guaraní S.A. &lt;receipts@orval.example&gt;</span><span>To</span><span>'+esc(t.email)+'</span><span>Subject</span><span data-pt="X15"><b>Payment received: '+money(t.dest,t.cur,{code:true})+' from Importadora Guaraní S.A.</b></span><span>Date</span><span>'+(when?fdt(when):'Sent when credited')+'</span></div>'+
  '<div class="mail-body"><div class="mail"><div class="mail-top">'+logoSvg('#FFFFFF','logo')+'</div><div class="mail-in" data-pt="P16"><h1>You have received a payment</h1><p class="muted mt8">Importadora Guaraní S.A. (Paraguay) sent you a payment through Orval. It was credited to your account at '+esc(b.bank)+(when?' on '+fd(when):'')+'.</p>'+
  '<div class="mail-amt">'+money(t.dest,t.cur,{code:true})+'</div><p class="hint">Credited to '+esc(b.bank)+' '+esc(b.acct)+'</p>'+
  '<div class="dl mt16"><div><span class="k">From</span><span class="v">Importadora Guaraní S.A.</span></div><div><span class="k">Reference</span><span class="v">'+(t.ref?esc(t.ref):'None')+'</span></div><div><span class="k">Payment date</span><span class="v">'+fd(t.at)+'</span></div>'+trk+'</div>'+
  '<button type="button" class="btn btn-primary btn-lg btn-block mt20" data-act="toast" data-msg="Protótipo: baixaria o comprovante da Orval em PDF" data-pt="D55">'+ic('download',16)+'Download receipt (PDF)</button>'+
  '<p class="hint mt16">Questions about this payment? Contact Importadora Guaraní S.A. at pagos@guarani.example.</p></div>'+
  '<div class="mail-foot" data-pt="P16"><span class="swo">'+sunSvg('#B38937',18)+'<span><b style="font-weight:600">Sent with Orval</b> · Pay suppliers abroad from one account.</span></span>'+foot+'</div></div></div></div></div>';
}

  else if(Object.values(S.recv).some(x=>x.toLowerCase()===a))E.addr='This is one of your own Orval addresses. Use Deposit to add funds.';
  else if(ORV_CLIENTS.some(o=>o.addr.toLowerCase()===a))E.addr='This address belongs to a company on Orval. Use Internal transfer instead.';

   Propostas de 06/10 para as pendências com a Taza (P43 a P50) e o que só a Taza responde (X33 a X37). */

/* ---------- My tasks: só ações de quem está logado, com botão e prazo (P49, P50) ---------- */
const TK_SEC=[['over','Overdue'],['soon','Due in the next 24 hours'],['later','Later']];
/* prazo pelo dia fixo do protótipo (TODAY): atrasada, vence em 24 horas ou depois */
function tkDue(due,soon){
  if(!due)return {g:soon?'soon':'later',l:''};
  const d=Math.round((new Date(due+'T12:00')-new Date(TODAY+'T12:00'))/864e5);
  if(d<0)return {g:'over',l:'Overdue, was due '+fds(due)};
  if(d===0)return {g:'soon',l:'Due today'};
  if(d===1)return {g:'soon',l:'Due tomorrow'};
  return {g:'later',l:'Due '+fds(due)};
}
const reqById=id=>S.reqs.find(r=>r.id===id);
/* ponto final sem duplicar quando o nome já termina em ponto (Ltd., S.A.) */
const endDot=s=>/[.!?]$/.test(s)?s:s+'.';
/* quem vê cada pedido: documentos do pagamento (Owner, Admin e quem criou), ação no pagamento (quem criou e aprovadores), empresa e conta (Owner e Admin) */
function reqSees(r){const t=r.tx?txById(r.tx):null;
  if(r.kind==='rfi')return rank()>=3||(!!t&&isMine(t));
  if(r.kind==='action')return (!!t&&isMine(t))||can.approve();
  return can.apply();}
function reqReady(r){return r.docs.every(([k])=>r.files[k])&&(!r.q||(r.ans||'').trim().length>=2);}
function tasks(){
  const L=[],nm=t=>t.kind==='payment'?ben(t.ben).name:txParty(t).who,amt=t=>mAmtTxt(t);
  if(!single())S.txs.filter(canApprove).forEach(t=>L.push({k:'approve',tone:'warn',i:'shield',t:t.kind==='payment'?'Approve payment':(t.kind==='internal'?'Approve transfer':'Approve withdrawal'),d:amt(t)+' to '+nm(t),meta:'Created by '+(t.by||'your team')+' on '+fds(t.at),cta:'Review',href:'#/tx/'+t.id}));
  S.txs.filter(canConfirmReady).forEach(t=>L.push({k:'confirm',tone:'warn',i:'clock',t:'Confirm payment',d:endDot(amt(t)+' to '+nm(t))+' Compliance approved it.',meta:'The rate locks for 60 seconds when you open it',cta:'Confirm',href:'#/tx/'+t.id,soon:1}));
  S.reqs.filter(r=>r.open&&reqSees(r)&&(r.kind!=='acct'||S.bank.state==='review')).forEach(r=>L.push({k:r.kind,tone:r.kind==='rfi'||r.kind==='action'?'warn':'',i:r.kind==='kyb'?'building':(r.kind==='acct'?'bank':(r.kind==='action'?'alert':'file')),t:r.t,d:r.d,cta:r.kind==='action'?'Open':'Upload',act:'reqOpen',id:r.id,due:r.due}));
  if(S.bank.state==='draft'&&can.apply())L.push({k:'finish',tone:'',i:'bank',t:'Finish your account application',d:'Accounts to receive from clients abroad. You stopped at step '+S.ap.step+' of 4.',cta:'Continue',href:'#/banking/apply'});
  if(can.pay())S.bens.filter(b=>b.status==='Needs update').forEach(b=>L.push({k:'ben',tone:'',i:'users',t:'Update beneficiary',d:b.name,meta:b.note||'The bank details need an update',cta:'Update',act:'benFix',id:b.id}));
  if(rank()>=2){const av=avail();S.txs.filter(t=>t.kind==='payment'&&srcCode(t)==='USDC'&&CONF.includes(t.status)&&(t.status==='Ready to confirm'||leftAppr(t)<=1)&&ttot(t)>av).forEach(t=>L.push({k:'funds',tone:'warn',i:'deposit',t:'Add funds',d:'Add '+money(r2(ttot(t)-av))+' to pay '+nm(t)+' ('+money(ttot(t))+' with fees).',meta:'Before the quote expires',cta:'Deposit',act:'depOpen',soon:1}));}
  return L;
}
function tkSorted(){const o={over:0,soon:1,later:2};return tasks().map(x=>Object.assign(x,{du:tkDue(x.due,x.soon)})).sort((a,b)=>o[a.du.g]-o[b.du.g]||(a.due||'9').localeCompare(b.due||'9'));}

const XR=Object.assign({},RATES,{USDC:1,GBP:0.79,JPY:149.5,CNH:7.13,SGD:1.34,CAD:1.37,CHF:0.88,AUD:1.52,HKD:7.8,DKK:6.78,NOK:10.6,NZD:1.66,SEK:10.5});
const curDec=c=>(c==='JPY'||c==='PYG')?0:2;
/* cotação de uma moeda para outra, pela tabela indicativa */
function fxRate(a,b){a=a==='USDC'?'USD':a;b=b==='USDC'?'USD':b;return (XR[b]||1)/(XR[a]||1);}
function fxText(a,b){a=a==='USDC'?'USD':a;b=b==='USDC'?'USD':b;if(a===b)return 'No conversion';const r=fxRate(a,b);if(r<1&&a==='USD')return '1 '+b+' = '+nf(1/r,4)+' '+a;return '1 '+a+' = '+nf(r,r>=100?2:4)+' '+b;}
/* valor com o código da moeda, como no Figma ("1,000.00 USDC", "EUR 4,230.00") */
function amtC(v,c){if(c==='USDC')return nf(v)+' USDC';if(c==='USD')return money(v);return c+' '+nf(v,curDec(c));}
const balName=c=>c==='USDC'?'USDC wallet':c+' balance';

const M_TYPE={payment:'Send',withdraw:'Withdraw',deposit:'Deposit',transfer:'Transfer',internal:'Transfer',bank:'Received'};
const mType=t=>M_TYPE[t.kind]||'Movement';
function mParty(t){
  if(t.kind==='payment'){const b=ben(t.ben)||{name:'Beneficiary',bank:'',acct:'',m:'SWIFT',cur:t.cur,country:''};return {who:b.name,sub:(b.bank+' '+b.acct).trim(),method:(b.m==='SWIFT'?'SWIFT':(b.rail||'Local'))+' · '+b.cur,flag:b.country};}
  if(t.kind==='withdraw'){const o=own(t.dest);
    if(o&&o.kind==='bank')return {who:o.label+' '+o.acct,sub:'Your company account · '+o.cur,method:o.m+' · '+o.cur,flag:o.country,bank:o};
    const a=txAsset(t);return {who:o?o.label:'External wallet',sub:short(t.addr),method:'Crypto · '+a.asset+' · '+NET[a.net].name,crypto:a};}
  if(t.kind==='transfer')return {who:balName(t.from)+' to '+balName(t.to),sub:'Between your balances',method:t.from+' to '+t.to};
  if(t.kind==='internal'){const o=orv(t.party),a=txAsset(t);return {who:o?o.name:'Company on Orval',sub:o?'Orval ID '+o.oid:'',method:'On-chain · '+NET[a.net].name,crypto:a};}
  if(t.kind==='bank')return {who:t.party,sub:'Banking account · '+t.cur,method:t.method+' · '+t.cur};
  if(t.via==='crypto'){const a=txAsset(t);return {who:a.asset+' deposit',sub:'From '+short(t.addr),method:'Crypto · '+a.asset+' · '+NET[a.net].name,crypto:a};}
  return {who:'Bank deposit',sub:t.from||'',method:'Bank transfer · '+(t.cur||'USD')};
}
function mIco(t){
  const P=mParty(t);if(P.flag)return '<span class="hl2-ic">'+fl(P.flag)+'</span>';
  const bad=DONE_BAD.includes(t.status),inn=t.kind==='deposit'||t.kind==='bank';
  const i=t.kind==='transfer'?'swap':(inn?'down':(t.kind==='withdraw'?'withdraw':'up'));
  return '<span class="tico '+(bad?'ti-bad':(inn?'ti-in':'ti-out'))+'">'+ic(i,16)+'</span>';
}
/* de onde sai o dinheiro: carteira em USDC (mostrada em USD) ou saldo de uma moeda da conta multimoeda (P54) */
const srcCode=t=>t.src&&t.src!=='USDC'?t.src:'USDC';
const srcCurOf=t=>srcCode(t)==='USDC'?'USD':srcCode(t);
function balOf(c){return c==='USDC'?avail():((S.bank.bal[c]||{}).avail||0);}
function adjBal(c,d){if(c==='USDC'){if(d<0)debit(-d);else credit(d);}else{const b=S.bank.bal[c]||(S.bank.bal[c]={avail:0,pend:0});b.avail=r2(b.avail+d);}}
/* custo total na moeda de origem; cobre, debita e devolve (aprovação, confirmação e cancelamento) */
function txCost(t){if(t.kind==='transfer')return r2(t.amt+(t.fee||0));if(srcCode(t)==='USDC')return ttot(t);return t.srcAmt!=null?t.srcAmt:r2((t.amt||0)+(t.fee||0));}
const txFrom=t=>t.kind==='transfer'?t.from:srcCode(t);
const txCanCover=t=>txCost(t)<=balOf(txFrom(t));
function txDebit(t){adjBal(txFrom(t),-txCost(t));}
function txCredit(t){adjBal(txFrom(t),txCost(t));}
function mAmt(t){
  const bad=DONE_BAD.includes(t.status),pre=PRE.includes(t.status);
  if(t.kind==='bank')return {v:'+'+amtC(t.amt,t.cur),cls:t.status==='Processing'?'off':'inc'};
  if(t.kind==='transfer')return {v:'-'+amtC(t.amt,t.from),s:'+'+amtC(t.recv,t.to),cls:bad?'off':''};
  if(isUsdtDep(t))return {v:'+'+money(t.conv.usdc),s:'From USDT '+nf(t.usd),cls:'inc'};
  if(t.kind==='deposit')return {v:'+'+money(t.usd),cls:'inc'};
  if(t.kind==='withdraw'){const o=own(t.dest),c=srcCode(t);return {v:'-'+amtC(t.amt!=null?t.amt:t.usd,c),s:o&&o.kind==='bank'&&t.destAmt?amtC(t.destAmt,o.cur)+' received':'',cls:bad||pre?'off':''};}
  const sc=srcCurOf(t),out=srcCode(t)==='USDC'?money(t.usd):amtC(t.srcAmt||t.usd,sc);
  return {v:'-'+out,s:t.cur!==sc?amtC(t.dest,t.cur):'',cls:bad||pre?'off':''};
}
const mAmtTxt=t=>{const a=mAmt(t);return esc(a.v.replace(/^[-+]/,''));};
function txAny(id){return txById(id)||bankTxs().find(x=>x.id===id);}
function txCode(t){return 'ORV-'+t.at.slice(2,4)+t.at.slice(5,7)+'-'+String(t.id).replace(/\D/g,'').padStart(5,'0');}

/* ---------- histórico em lista, como no Figma (filtros, linhas e paginação) ---------- */
const M_PER=[['all','Date range: All'],['7d','Last 7 days'],['30d','Last 30 days'],['month','This month']];
function mCur(t){if(t.kind==='payment'||t.kind==='bank')return t.cur;if(t.kind==='transfer')return t.from;if(t.kind==='withdraw'){const o=own(t.dest);return o&&o.kind==='bank'?o.cur:'USDC';}if(t.kind==='deposit')return t.via==='bank'?(t.cur||'USD'):txAsset(t).asset;return 'USDC';}
function mMethod(t){if(t.kind==='bank')return t.method==='SWIFT'?'swift':'local';if(t.kind==='payment')return isSwift(t)?'swift':'local';if(t.kind==='transfer')return 'fx';if(t.kind==='withdraw'){const o=own(t.dest);return o&&o.kind==='bank'?(o.m==='SWIFT'?'swift':'local'):'crypto';}return t.kind==='deposit'&&t.via==='bank'?'bank':'crypto';}
const mSt=s=>['Credited','Completed'].includes(s)?'done':(DONE_BAD.includes(s)?'failed':(PRE.includes(s)?'pending':'progress'));

function sdCalc(){const sd=S.sd,b=sd.acct?ben(sd.acct):null;if(!b)return null;

function freshAf(o){return Object.assign({mode:'add',idx:-1,bid:null,gid:null,country:'',mi:-1,f:{},sub:false,code:'',err:'',busy:false},o||{});}
const afM=()=>{const a=S.af;return a&&a.country&&a.mi>=0?(METHODS[a.country]||[])[a.mi]:null;};
function afHolder(){const a=S.af;if(a.gid)return grp(a.gid);return {name:S.cb.f.name,kind:S.cb.kind,country:S.cb.f.country};}
function afFields(){const m=afM();if(!m)return [];let L=NB_FORMS[m.form].slice();if(m.form==='cn')L=L.concat(['cnName'].concat(afHolder().kind==='Business'?['uscc']:[]).concat(['mobile']));return L;}
function afDef(k){const m=afM(),d=Object.assign({},AF_X[k]||NB_F[k]);if(k==='branch'&&m&&m.form==='cn'){d.opt=1;d.l='Branch name';}if(k==='acct'&&m&&m.form==='br')d.ph='12345-6';return d;}
function afErrors(){const a=S.af,f=a.f,E={};
  afFields().forEach(k=>{const d=afDef(k),v=String(f[k]||'').trim();if(!v){if(!d.opt)E[k]=d.sel?'Choose an option':'Required';return;}
    if(k==='iban'){const e=ibanOk(v,a.country);if(e)E[k]=e;}
    if(k==='swift'||k==='bic'){const s=v.replace(/\s/g,'').toUpperCase();if(!/^[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$/.test(s))E[k]='SWIFT/BIC codes have 8 or 11 characters';else if(s.slice(4,6)!==a.country)E[k]='This code is for a bank in '+(COUNTRY[s.slice(4,6)]||s.slice(4,6))+', not '+COUNTRY[a.country];}
    if(k==='aba'){const e=abaOk(v);if(e)E[k]=e;}
    if(k==='tax'){const s=v.replace(/\D/g,'');if(s.length!==14&&s.length!==11)E[k]='CNPJ has 14 digits and CPF has 11';}
    if(k==='bankCode'&&!/^\d{3}$/.test(v))E[k]='Bank codes have 3 digits';
    if(k==='acct'&&!/^[\d\s-]{4,34}$/.test(v))E[k]='Use digits only';
    if(k==='uscc'&&!/^[0-9A-Z]{18}$/i.test(v.replace(/\s/g,'')))E[k]='The USCC has 18 letters and numbers';
    if(k==='mobile'&&!/^\+?86[\d\s]{11,14}$/.test(v))E[k]='Use a Chinese mobile number, like +86 138 0013 8000';});
  return E;}
function afKey(){const f=S.af.f;return String(f.iban||f.acct||'').replace(/[\s-]/g,'').toUpperCase();}
function afDup(){const k=afKey();if(k.length<6)return null;const a=S.af;
  const inDraft=a.mode==='add'||a.mode==='edit'?S.cb.accts.find((x,i)=>i!==a.idx&&String(x.f.iban||x.f.acct||'').replace(/[\s-]/g,'').toUpperCase()===k):null;
  if(inDraft)return 'This account is already in the list.';const b=S.bens.find(x=>x.id!==a.bid&&String(x.key||'').replace(/[\s-]/g,'').toUpperCase()===k);return b?'This account is already saved for '+b.name+'.':null;}
Object.assign(MODALS,{
  af(){const a=S.af,m=afM(),E=a.sub?afErrors():{},dup=m?afDup():null,h=afHolder(),repl=a.mode==='repl',old=a.bid?ben(a.bid):null,lock=S.tries<=0,code=String(a.code||'').replace(/\D/g,'');
    const title=repl?'Replace bank account':(a.mode==='edit'||a.mode==='eedit'?'Edit bank account':'Add bank account');
    const fields=m?afFields().map(k=>{const d=afDef(k);return field({id:'af-'+k,label:d.l,opt:d.opt,bind:'af.f.'+k,val:a.f[k]||(d.sel?d.sel[0][0]:''),ph:d.ph,mono:d.mono,err:E[k],select:d.sel,full:['iban','bankAddr','cnName'].includes(k)});}).join(''):'';
    return mDlg('<div class="m-h" data-pt="P51 P47 P48"><div><h2 id="m-t">'+title+'</h2><p class="m-sub">'+(repl?'The current account stays in the history and is deactivated. The new one counts as new for approvals and may go through a compliance review.':(m?'Fill in '+esc(NB_FORMS[m.form].map(k=>afDef(k).l).join(', '))+' for '+COUNTRY[a.country]+'.':'Where the beneficiary receives the money.'))+'</p></div>'+mClose+'</div>'+
      '<div class="m-b">'+(repl&&old?'<div class="ac off"><span class="ac-i">'+ic('bank',18)+'</span><div class="ac-b"><b>'+esc(acctBank(old))+' '+esc(old.acct)+'</b><span>Current account · '+acctLine(old)+'</span></div></div>':'')+
      '<div class="fgrid"><div class="field"><label for="af-c">'+reqL('Destination country')+'</label>'+selIn('af-c','af.country',a.country,[['','Choose a country']].concat(Object.keys(METHODS).map(k=>[k,COUNTRY[k]])))+'</div>'+
      '<div class="field"><span class="flabel">Account holder</span><div class="in ro"><span>'+esc(h.name||'Beneficiary name')+'</span>'+ic('lock',14)+'</div><div class="hint">Must match the name on the bank account.</div></div></div>'+
      (a.country?'<div class="field" role="radiogroup" aria-labelledby="af-ml" data-pt="D8 P59 X37"><span class="flabel" id="af-ml">'+reqL('Method and currency')+'</span><div class="pick2">'+METHODS[a.country].map((x,i)=>'<button type="button" role="radio" aria-checked="'+(a.mi===i)+'" class="pk2'+(a.mi===i?' on':'')+'" data-act="afMethod" data-i="'+i+'"><span><b>'+mLabel(x)+' · '+x.cur+'</b><span class="pk2-d">'+(x.m==='SWIFT'?'International transfer in '+x.cur+'.':'Local transfer in '+COUNTRY[a.country]+'.')+' Usually '+x.eta.toLowerCase()+'.</span></span><span class="rd" aria-hidden="true"></span></button>').join('')+'</div></div>'+
        (a.country==='CN'?xban('cnLocal'):(a.country==='PY'?xban('pyLocal'):'')):'')+
      (m?(dup?'<div class="al wn" role="alert">'+ic('alert')+'<div><b>Possible duplicate</b><span>'+esc(dup)+'</span></div></div>':'')+'<div class="fgrid">'+fields+'</div>':'')+
      (m?pnote('afFill','Campos no modelo do parceiro, por país e método.','<button type="button" class="pbtn" data-act="afFill">Preencher exemplo</button>'):'')+
      (repl&&m?(lock?codeBox('','','','',true,'changes are'):otpBox('af-code','af.code',a.code,a.err,'Verification code from your authenticator')):'')+'</div>'+
      '<div class="m-f"><button type="button" class="btn btn-secondary" data-act="closeModal">Cancel</button><button type="button" class="btn btn-primary" data-act="afSave"'+(!m||(repl&&(lock||code.length!==6))||a.busy?' disabled':'')+'>'+(a.busy?'<span class="spin" aria-hidden="true"></span>Saving':(repl?'Replace account':'Save'))+'</button></div>','wide');}
});
/* resumo de uma conta (rascunho do cadastro ou conta salva) */
function acRow(x,actions,off){
  return '<div class="ac'+(off?' off':'')+'"><span class="ac-i">'+ic('bank',18)+'</span><div class="ac-b"><b>'+esc(x.bank)+(x.badge||'')+'</b><span>'+esc(x.line)+' · '+cc(x.country)+' '+COUNTRY[x.country]+'</span>'+(x.note?'<span>'+x.note+'</span>':'')+'</div>'+(actions?'<div class="ac-a">'+actions+'</div>':'')+'</div>';}
function draftView(x){const m=METHODS[x.country][x.mi],f=x.f,raw=String(f.iban||f.acct||'').replace(/[\s-]/g,'');
  return {bank:f.bank||f.pyBank||(m.form==='br'?'Bank '+f.bankCode:((f.swift||f.bic||'').toUpperCase()||'Bank account')),line:(m.m==='SWIFT'?'SWIFT':(m.rail||'Local'))+' · '+m.cur+' · '+(f.iban?raw.slice(0,4)+' •••• '+raw.slice(-4):'•••• '+raw.slice(-4)),country:x.country};}

  afFill(){const a=S.af,m=afM();if(!m)return;let x=AF_SAMPLE[m.form]||NB_SAMPLE[m.form];if(x&&!x.bank&&!x.iban&&!x.acct&&!x.aba)x=x[a.country]||AF_SAMPLE[a.country]||Object.values(x)[0];if(m.form==='swift'&&a.country==='PY')x=AF_SAMPLE.PY;

function route(){
  const h=(location.hash||'').replace(/^#\/?/,''),qi=h.indexOf('?');
  const path=qi<0?h:h.slice(0,qi),params=new URLSearchParams(qi<0?'':h.slice(qi+1));
  const segs=path.split('/').filter(Boolean);let key=segs.join('/')||'indice',arg=null;
  if(segs[0]==='tx'){key='tx';arg=segs[1]||'';}
  if(segs[0]==='onboarding'){key='onboarding/'+Math.min(8,Math.max(1,parseInt(segs[1]||'1',10)||1));}
  if(!SCR[key])key='indice';
  return {key,arg,params};

  const prev=S.r?S.r.key:'';

    if(b||g){const x=b?ben(b):null,gg=g?grp(g):(x?grp(x.g):null);S.sd=freshSd();if(gg){S.sd.g=gg.id;S.sd.email=gg.email||'';const A=S.bens.filter(y=>y.g===gg.id&&acctPayable(y));S.sd.acct=x&&acctPayable(x)?x.id:(A.length===1?A[0].id:null);}const a=parseAmt(r.params.get('a'));if(!isNaN(a))S.sd.amt=String(a);history.replaceState(null,'','#/send');return route();}
    if(prev!=='send')S.sd=freshSd();}
  if(r.key==='withdraw'&&prev!=='withdraw')S.wd2=freshWd();
  if(r.key==='transfer'&&prev!=='transfer')S.tf=freshTf();

  if(r.key==='pay/review'){let c=calc();if((!c||!c.valid||c.insuf)&&r.params.get('demo')){demoPay(S);c=calc();}
    if(!c||!c.valid||c.insuf||!can.pay()||c.b.status!=='Active'){history.replaceState(null,'','#/pay');return route();}
    if(!S.pay.lockUntil)S.pay.lockUntil=Date.now()+QUOTE_MS;if(r.params.get('demo'))history.replaceState(null,'','#/pay/review');}
  if(r.key==='pay/status'){if(!S.lastPay||!txById(S.lastPay))S.lastPay='t9';if(r.params.get('demo'))history.replaceState(null,'','#/pay/status');startCqFor(txById(S.lastPay));}
  if(r.key==='tx'){const t=txById(r.arg);if(!t){history.replaceState(null,'','#/transactions');return route();}startCqFor(t);}
  if(r.key==='onboarding/2'&&!S.onb.resendAt)S.onb.resendAt=Date.now()+45000;
  if(r.key==='email'){if(r.params.get('tx'))S.mailTx=r.params.get('tx');if(r.params.get('kind'))S.mailKind=r.params.get('kind')==='team'?'team':'ben';}

function drawMarkers(){

function headerBottom(){if($('#modal-root .modal'))return 0;let b=$('#strip').getBoundingClientRect().bottom;const tb=$('#topbar');if(document.body.classList.contains('mode-app')&&tb.offsetParent!==null)b=Math.max(b,tb.getBoundingClientRect().bottom);return Math.max(0,Math.round(b));}
function placeMarkers(){
  const layer=$('#pt-layer');if(!hosts.length)return;
  const top=headerBottom();layer.style.setProperty('--pt-top',top+'px');
  const cache=new Map();const clipOf=a=>{if(!cache.has(a)){const cs=getComputedStyle(a);cache.set(a,cs.overflowX!=='visible'||cs.overflowY!=='visible');}return cache.get(a);};
  hosts.forEach(([el,g])=>{
    if(!el.isConnected){g.hidden=true;return;}
    const r=el.getBoundingClientRect();if(!r.width&&!r.height){g.hidden=true;return;}
    let x=r.right,y=r.top,vis=true;
    for(let a=el.parentElement;a&&a!==document.body&&a!==document.documentElement;a=a.parentElement){
      if(a.id==='pt-layer')break;
      if(clipOf(a)){const ar=a.getBoundingClientRect();if(r.right<ar.left+6||r.left>ar.right-6||r.bottom<ar.top+2||r.top>ar.bottom-2){vis=false;break;}x=Math.min(x,ar.right-2);y=Math.max(y,ar.top);}
    }
    if(vis&&(r.right<=4||r.left>=innerWidth-4||r.bottom<=top+4||r.top>=innerHeight))vis=false;
    g.hidden=!vis;if(vis){y=Math.max(y,top+10);g.style.left=Math.round(Math.min(Math.max(x,48),innerWidth-2))+'px';g.style.top=Math.round(y-top)+'px';}
  });
}

  if(e.key==='Escape'&&S.sd&&S.sd.dd&&!S.modal){S.sd.dd=false;render();const b=$('.dd2-b');if(b)b.focus();return;}
  if(e.key==='Escape'&&S.tip){S.tip=null;render();return;}
  if(e.key==='Escape'){if(S.modal&&S.modal.type==='dep'&&S.dep.dd){S.dep.dd=false;render();const b=$('.dd-btn');if(b)b.focus();}else if(S.modal){S.modal=null;render();}else if(S.menu){S.menu=null;render();}else if(S.npOpen||S.sbOpen){S.npOpen=false;S.sbOpen=false;render();}return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tr[data-act]')){e.preventDefault();e.target.click();}
});
window.addEventListener('hashchange',()=>{S.menu=null;S.modal=null;S.sbOpen=false;S.npOpen=false;S.tip=null;if(S.sd)S.sd.dd=false;render();});
let rafP=0;const schedule=()=>{if(rafP)return;rafP=requestAnimationFrame(()=>{rafP=0;placeMarkers();});};
window.addEventListener('scroll',schedule,{passive:true,capture:true});
window.addEventListener('resize',schedule);
setInterval(tick,1000);
function boot(){
  const sel=$('#st-sel');sel.innerHTML='<option value="#/indice">'+(CLEAN?'Telas':'Índice dos pontos')+'</option>'+SMAP.map(g=>'<optgroup label="'+esc(g.g)+'">'+g.items.map(([k,l])=>'<option value="'+probeHref(k)+'">'+esc(l)+'</option>').join('')+'</optgroup>').join('');
  buildWhere();
  if(!location.hash)history.replaceState(null,'','#/indice');
  render();
  if(window.ResizeObserver){const ro=new ResizeObserver(schedule);ro.observe(document.body);ro.observe($('#view'));}
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(schedule);
}
boot();

</script>
