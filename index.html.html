<script>
'use strict';
/* ===================== Catálogo de pontos (PT) · só na versão interna =====================
   t: eq = decidido pela equipe (24, 25 e 26/09) · mk = decidido pelo Marcos (23 a 25/09)
      br = régua do Brief v2 · pr = proposta a validar · pd = pendência
   proc: processo, sem tela. novo: pendência levantada pelo protótipo.
   rev: revisão posterior. st: ok = resolvida ou confirmada · sup = superada. */
const CLEAN = false;
const PT = {
  D1:{t:'eq',title:'MVP em pagamentos de importação e exportação',body:'Toda a navegação gira em torno de pagar fornecedores no exterior.',who:'Mohammad',date:'24/09',why:'"Focar no mercado que a gente conhece, que é o de pagamento de importação e exportação."'},
  D2:{t:'eq',title:'Envio em lote fora do MVP',body:'Um beneficiário por pagamento. Bulk send entra em fase futura.',who:'Mohammad',date:'24/09',why:'Mesmo foco do D1. O Marcos tinha sugerido lote para pagamento de funcionários.'},
  D3:{t:'eq',title:'Mercado de teste: Paraguai',body:'Paraguai primeiro; depois Argentina, Uruguai, Colômbia, Equador, Peru, Chile e Brasil. No cadastro da empresa só o Paraguai aparece disponível.',who:'Mohammad',date:'24/09',why:'É o mercado que eles conhecem; "a América do Sul inteira trabalha nessa modalidade".'},
  D4:{t:'eq',title:'Taxa de 0,40% por pagamento',body:'Com o dinheiro do próprio cliente, sem antecipação nem financiamento.',rev:'O documento de payout mostrado em 26/09 traz fee por tier (0,20% ou 0,30%), spread de 0,10% embutido no câmbio e taxa de pagamento por rail. O v3 usa 0,20% mais a taxa de pagamento (X26).',who:'Mohammad',date:'24/09',why:'Diferenciar da MS (0,60% com financiamento, "venda casada").'},
  D5:{t:'eq',title:'Gas pago pela operação',body:'Custo de rede embutido na taxa: o cliente não precisa de saldo para gas.',rev:'Revista em 26/09 (D42): nos envios on-chain (Send e Internal transfer), a taxa de rede é cotada e descontada do saldo em USDC.',who:'Mohammad e Luis',date:'24/09',why:'A demo da Reah mostrou o atrito de exigir gas. A assinatura sugerida pelo Marcos não foi adotada.'},
  D6:{t:'eq',title:'Saldo em stablecoin, conversão só no pagamento',body:'O cliente mantém saldo em USDC, sempre na Ethereum (D31); a conversão para a moeda do beneficiário acontece no payout, via Tazapay.',who:'Luis',date:'24/09',why:'"Na nossa plataforma o cliente vai depositar stable, vai manter o saldo em stable coin e na hora que for fazer um payout faz a conversão."'},
  D7:{t:'eq',title:'Tazapay primeiro, com orquestração',body:'A Tazapay é a primeira conexão de payout, mas a Orval vai orquestrar vários parceiros. Por isso a tela não mostra o parceiro: mostra que a Orval escolhe a rota.',who:'Mohammad',date:'24/09',why:'"Não quer dizer que vai ser só eles."'},
  D8:{t:'eq',title:'Cadastro de beneficiário no modelo da Tazapay',body:'Modalidade Swift ou local, país, moeda aceita, titular, registro da empresa opcional, banco, IBAN, SWIFT e endereço; ABA nos EUA; Brasil com tax ID, código do banco e tipo de conta (sem chave Pix).',who:'Consenso',date:'24/09',why:'Decisão consensual registrada na ata.'},
  D9:{t:'eq',title:'Endereço de depósito com QR code',body:'QR no Deposit, com o logo da rede no centro (D33).',who:'Luis levantou; Marcos confirmou',date:'24/09',why:'A Tazapay não oferece QR e isso dificulta copiar.'},
  D10:{t:'eq',title:'E-mail automático ao beneficiário',body:'Comprovante enviado ao beneficiário quando o pagamento é creditado. O e-mail vem do cadastro e pode ser trocado no pagamento.',rev:'Mantido em 26/09 como opcional (D55); a confirmação de crédito passa a ir também para a equipe do cliente.',who:'Mohammad',date:'24/09',why:'Informa o fornecedor e divulga a Orval ("fui receber dinheiro da Orval").'},
  D11:{t:'eq',title:'Cartões no futuro',body:'Nenhuma tela de cartão neste protótipo.',who:'Mohammad',date:'24/09',why:'"Cartão no futuro. Sim, sem dúvida."'},
  D12:{t:'eq',title:'Rendimento no futuro',body:'Sem APY nem rendimento sobre saldo neste protótipo.',who:'Mohammad',date:'24/09',why:'Visto na Reah (2% APY); será um módulo futuro.'},
  D13:{t:'eq',title:'Uso principal: pega e manda',body:'Cadastrar o fornecedor uma vez e pagar rápido; a Home tem atalhos para beneficiários frequentes. Invoice não é o foco (entrada no MVP em aberto, X6).',who:'Marcos e Mohammad',date:'24/09',why:'O cliente "só manda pix e tchau"; o Marcos defendeu invoice para retenção.'},
  D14:{t:'eq',proc:1,title:'Validação interna antes da equipe externa',body:'Este protótipo só vai para a equipe externa depois de validado internamente. Para a UDS vai só a versão limpa.',who:'Mohammad',date:'24/09',why:'Evitar que a responsabilidade saia da equipe terceirizada.'},
  D15:{t:'eq',proc:1,title:'Reuniões seg, qua e sex com a equipe externa',body:'Uma hora a cada dois dias.',who:'Mohammad',date:'24/09',why:'Forçar o progresso da equipe externa.'},
  D16:{t:'eq',title:'Design da Unified atualizado como base',body:'Este HTML é essa base: estrutura da Unified (menu lateral, CTA de pagamento, cards, tabelas e modais) com a marca Orval (tokens v2, Optika e DM Mono, tema claro).',who:'Marcos, aceito pelo grupo',date:'24/09',why:'Dar à equipe externa uma referência concreta.'},
  D17:{t:'eq',proc:1,title:'Registrar todas as horas',body:'Processo de entrada como sócio.',who:'Mohammad',date:'24/09',why:'A call de 24/09 contou 1h30.'},
  D18:{t:'eq',proc:1,title:'Acesso à Reah para o Marcos',body:'Experiência real da ferramenta de referência.',who:'Mohammad',date:'24/09',why:'"Em vez de você só olhar eu fazer, você seria o prático."'},
  D30:{t:'eq',title:'EURC só depois do MVP',body:'Sem EURC e sem conversão entre EURC e USDC no lançamento. O depósito oferece só USDC e USDT.',who:'Mohammad',date:'25/09',why:'Exigiria um botão Convert e outro orçamento. Gabriel: a conta hoje está parametrizada só em dólar.'},
  D31:{t:'eq',title:'Saldo só em USDC, sempre na Ethereum',body:'USDT recebido (Ethereum ou Tron) vira USDC.',rev:'Revista em 26/09 (D40): sem popup de aprovação; a conversão é automática.',who:'Mohammad',date:'25/09',why:'"Nós não podemos ter o saldo dele em USDT."'},
  D32:{t:'eq',title:'Uma carteira com envio: USDC · Ethereum',body:'Os endereços de USDT são só de recebimento, sem botão Send. A Wallet 2 saiu.',who:'Mohammad; carteira única proposta pelo Marcos',date:'25/09',why:'"Não precisa pôr o botão send." Mohammad pediu que o USDT seja fácil de achar.'},
  D33:{t:'eq',title:'Depósito: ativo e rede antes do QR',body:'Três opções: USDC · Ethereum, USDT · Ethereum e USDT · Tron. QR com o logo da rede no centro, ícone do ativo com selo da rede e botão Deposit com USDC e USDT. Aqui os logos são marcadores genéricos; os oficiais entram na implementação.',who:'Marcos propôs, Mohammad aprovou',date:'25/09',why:'O cliente vê de cara que pode depositar USDT.',rev:'Em 29/09 o Marcos pediu para tirar os ícones de USDC e USDT dos botões Deposit (v3.1). Muda parte desta decisão: validar com o Mohammad. Em 30/09 o Deposit virou um modal com o seletor de ativo e rede (D66).'},
  D34:{t:'eq',title:'Depósito em Crypto e Fiat',body:'Duas abas no Deposit.',rev:'Fiat definido em 26/09 como on-ramp para USDC (D43). Em 30/09 as abas saíram: o cripto virou modal (D66) e o fiat ficou em tela própria (X30).',who:'Mohammad',date:'25/09',why:'O pay-in nunca foi feito com a Tazapay e precisa ser validado.'},
  D35:{t:'eq',title:'Send para fora e Internal transfer',body:'Send envia USDC para uma carteira externa. Internal transfer envia USDC para outro cliente da Orval.',rev:'Refinada em 26/09 (D41, D42); o Send para fora foi reconfirmado. Em 30/09 virou Withdraw, o saque cripto (D72); Send passou a ser o pagamento.',who:'Mohammad',date:'25/09',why:'"O send eu acho que é para ele mandar para fora o USDC."'},
  D36:{t:'eq',title:'Histórico da carteira: período e tipo',body:'Só dois filtros na Wallet. A ata do Gemini diz Banking, mas a transcrição mostra que foi na Wallet.',who:'Marcos',date:'25/09',why:'Ajuste feito na reunião.',rev:'Em 30/09 a Wallet do Figma, aprovada sem mudanças (D65), tem também o filtro de status.'},
  D37:{t:'eq',title:'Conta multimoeda por aplicação adicional',body:'O cliente começa sem conta bancária em seu nome. A conta multimoeda (uma conta, várias moedas) vem por aplicação adicional, no OCBC, em nome do cliente, com custódia do banco. Pagar beneficiários não depende dela.',rev:'Refinada em 26/09 (D44, D57): aplicação leve, só PJ, análise de 72 horas.',who:'Mohammad; Gabriel sobre o payout',date:'25/09',why:'Aplicação básica reduz fricção; produto avançado pede mais documentos, como na Reah.'},
  D40:{t:'eq',title:'USDT vira USDC sem popup',body:'No depósito de USDT o cliente informa o valor e vê, antes de enviar, quanto recebe em USDC, a taxa e a cotação com tempo correndo, junto do QR. Enviar é o aceite; a conversão é automática; depois aparece só um aviso, e o histórico mostra que veio de USDT.',who:'Mohammad, com Gabriel',date:'26/09',why:'Gabriel: USDT parado esperando aprovação seria a Orval segurando USDT do cliente. Mohammad: "Só o fato dele enviar já é aprovação."',rev:'Em 30/09 o Deposit simples deixou de mostrar a cotação antes do envio (D66, X31).'},
  D41:{t:'eq',st:'sup',rev:'Superada em 06/10 pela D76: Transfer volta a ser entre os saldos da própria empresa, como no Figma.',title:'Internal transfer on-chain, por ID ou alias',body:'Entre as wallets dos clientes, na Ethereum. O destinatário é o ID do cliente (numérico) ou um alias; o rótulo diz que é on-chain. O próprio ID aparece no perfil para copiar. Sem KYT.',who:'Mohammad',date:'26/09',why:'Cada cliente tem sua wallet por regulatório; na Ethereum a transferência é barata. KYT dispensado porque o dinheiro já está no ecossistema.'},
  D42:{t:'eq',title:'Taxa de rede cotada e descontada em USDC',body:'Send e Internal transfer mostram a taxa de rede cotada na hora e descontam do saldo em USDC. O cliente nunca precisa de ETH.',who:'Mohammad',date:'26/09',why:'Atrito do "gas station" visto na Reah e numa exchange que travou o saque por falta de moeda para gas.'},
  D43:{t:'eq',title:'Pay-in em fiat é on-ramp para USDC',body:'Produto 1: o cliente escolhe a moeda (BRL por Pix, com cotação e tempo correndo; EUR e outras por transferência, com dados bancários e taxas) e o dinheiro vira USDC ao entrar. O saldo é sempre USDC. O pay-in tem custo.',who:'Mohammad e Gabriel',date:'26/09',why:'"O saldo sempre em USDC, esse é o standard." Fecha a contradição de 24 e 25/09 para o produto 1.'},
  D44:{t:'eq',title:'Banking é o produto 2 e entra no MVP',rev:'Proposta de 06/10 (P43): o pedido traz o KYB completo que a Taza exige; o prazo de 72 horas não tem base na documentação (X33).',body:'Aba com aplicação leve: só PJ; aceitar os termos, com elegibilidade de jurisdição e de segmento, taxa de abertura e mensalidade; análise de 72 horas. Taxas definidas pela Orval.',who:'Mohammad; Gabriel sobre "só PJ"',date:'26/09',why:'"Vamos pôr sim": o dinheiro que entra na Tazapay já aparece na plataforma, e isso é diferencial.'},
  D45:{t:'eq',title:'Saldo por moeda, sem total em USD',rev:'Proposta de 06/10 (P44, P45): mais de uma conta (a multimoeda de Singapura com as 14 moedas, USD e EUR locais e outras) e sem o endereço do titular, que a Taza não devolve. O saldo por moeda depende de a Orval habilitar cada moeda na Taza (X33).',body:'Uma conta para todas as moedas da lista (14). Bandeiras; saldo só nas moedas com dinheiro e as demais ao expandir. Nos dados bancários, endereço do banco e do titular.',who:'Mohammad; Gabriel sobre o total',date:'26/09',why:'Gabriel: o total confunde. BRL não existe no produto 2.'},
  D46:{t:'eq',title:'Aviso de compliance nos dados bancários e no depósito',body:'Ao revelar ou copiar os dados da conta (popup) e ao depositar: todo recebimento precisa de documentação de suporte e pode ser revisado pelo compliance. Texto final a definir.',who:'Mohammad e Gabriel',date:'26/09',why:'Recebimento irregular pode levar a Tazapay a encerrar o cliente.'},
  D47:{t:'eq',title:'Perfis e aprovações',body:'Admin (tudo), Operador (cria pagamento, não aprova) e Usuário (só visualiza). Com política de aprovação, o pagamento só sai depois das aprovações. Conta de um usuário paga e aprova num passo e não vê "Pending approvals".',rev:'Refinada em 28/09 (D58, D59): cinco papéis no modelo sugerido pelo Mohammad (Koywe), adaptado, e política de aprovação.',who:'Mohammad; Gabriel (usuário único); Marcos (classificação)',date:'26/09',why:'Um cliente grande da MS exige três aprovações.'},
  D48:{t:'eq',title:'Home objetiva',body:'Saem volume do dia, total e taxa de sucesso. Entram "On the way" em destaque, pagamentos do mês, o que pede atenção, beneficiários, boas-vindas, Pay grande e Deposit. A lista final de métricas passa pelo grupo.',who:'Marcos propôs; Mohammad e Gabriel concordaram',date:'26/09',why:'Mohammad: "on the way" é "super importante". Gabriel: "quanto mais objetivo, melhor".',rev:'Em 30/09 os números ficaram sem linha de detalhe (D61) e o card principal manteve New payout e Deposit (P37). Na terceira rodada de 30/09, New payout virou Send, que abre o pagamento (D72).'},
  D49:{t:'eq',title:'Atalho para beneficiário recorrente',body:'Ao lado do histórico, com valor e invoice editáveis. Aqui "Frequent beneficiaries" no lugar de "Pay again".',who:'Marcos; Mohammad e Gabriel concordaram',date:'26/09',why:'Gabriel: não replicar 100% do pagamento anterior.',rev:'Em 30/09 saiu do Dashboard (P38).'},
  D50:{t:'eq',title:'Cabeçalho com Available to pay e Deposit',body:'Fixo em todas as telas, com opção de ocultar o saldo.',who:'Marcos; Mohammad concordou',date:'26/09',why:'O cliente vê de cara se o saldo cobre o que precisa pagar.'},
  D51:{t:'eq',title:'Menu na ordem do Figma',body:'Dashboard, Wallet, Banking, Payout, Move money. Aqui Beneficiaries e Transactions vêm depois.',who:'Mohammad e Gabriel',date:'26/09',why:'"Do jeito que tá aí tá legal."',rev:'Em 30/09 o Payout saiu do menu e o Move money virou um grupo com Send, Withdraw, Deposit e Transfer (D68). Na terceira rodada, clicar em Move money abre a tela com as opções explicadas (D73).'},
  D52:{t:'eq',title:'Exportar CSV e PDF',body:'No histórico de transações.',who:'Gabriel',date:'26/09',why:'PDF se não for trabalhoso.'},
  D53:{t:'eq',title:'Perfil no menu',body:'Empresa, pessoa (para operadores), ID do cliente para copiar e dark mode.',who:'Marcos; Mohammad e Gabriel concordaram',date:'26/09',why:'Vários tipos de usuário; o ID serve para o Internal transfer.'},
  D54:{t:'eq',title:'Carteira em um card expandido',body:'Saldo, endereços de recebimento e mensagem explicativa no mesmo card.',who:'Marcos; Gabriel e Mohammad aprovaram',date:'26/09',why:'Com uma wallet só, os endereços cabem no mesmo card.',rev:'Em 30/09 os endereços saíram da Wallet e ficam no Deposit (D69, D66).'},
  D55:{t:'eq',title:'Comprovante próprio e confirmação de crédito à equipe',body:'"Download receipt" (PDF da Orval), sem MT103. A confirmação de crédito (webhook da Tazapay) vai por e-mail a admins e operadores. O e-mail opcional ao beneficiário continua; se o pagamento for cancelado, ele é avisado.',who:'Mohammad e Gabriel',date:'26/09',why:'Confirmação automática de crédito "não tem no mercado" (Gabriel).'},
  D56:{t:'eq',title:'Composição completa das taxas',body:'O resumo mostra valor, taxa Orval, taxa de pagamento e total, como no documento de payout.',who:'Mohammad',date:'26/09',why:'"Mostra o que é pro cliente e o que é para nós."'},
  D57:{t:'eq',title:'Onboarding básico',body:'Cadastro básico para começar; a conta multimoeda vem depois, por aplicação leve (D44). Sai a pergunta de intenção (P18).',who:'Mohammad',date:'26/09',why:'"Eu acho que não precisa ser completo."'},
  D60:{t:'eq',title:'Aprovação pela revisão',body:'Na lista de aprovações pendentes do Dashboard, cada linha tem um botão Review, sem Approve nem Reject. A aprovação acontece no detalhe do pagamento. O fluxo de aprovação ainda será validado com a equipe.',who:'Mohammad, na reunião com a UDS',date:'30/09',why:'Tirar a decisão da lista enquanto o fluxo não é validado.'},
  D61:{t:'eq',title:'Dashboard enxuto',body:'Abaixo do card principal, só os três números, Pending approvals e Transaction history no modelo do Figma: entrada em verde, saída na cor do texto e status com ponto colorido.',who:'Mohammad, na reunião com a UDS',date:'30/09',why:'Sem informação em excesso abaixo dos três números.'},
  D62:{t:'eq',title:'Coluna da direita do Dashboard',body:'Primeiro o quadro de alertas (nome em aberto, X29), depois um card com os ativos da wallet cripto e o card do Banking.',who:'Mohammad, na reunião com a UDS',date:'30/09',why:'O quadro tem função de aviso; o card do Banking agradou.'},
  D63:{t:'eq',title:'Empresa e Orval ID no menu',body:'No menu lateral, a empresa com o Orval ID logo abaixo do nome, com botão de copiar.',who:'Mohammad, na reunião com a UDS',date:'30/09',why:'O ID serve para receber Internal transfer (D41).'},
  D64:{t:'eq',title:'Moeda de exibição nas configurações',body:'A moeda em que o saldo aparece muda nas configurações do usuário. Não há botão de troca no Dashboard. Aqui a engrenagem ao lado do nome, no menu, abre as configurações.',who:'Mohammad, na reunião com a UDS',date:'30/09',why:'Substitui o botão de troca de saldo do Figma (P27).'},
  D65:{t:'eq',title:'Wallet sem mudanças',body:'O modelo do Figma para a Wallet fica como está. Aqui o histórico usa a mesma lista do Dashboard (P36) e continua só com movimentos cripto (P30).',who:'Mohammad, na reunião com a UDS',date:'30/09',why:'A equipe não viu necessidade de mudar.'},
  D66:{t:'eq',title:'Deposit simples em modal',body:'Um modal com ativo e rede num seletor (USDC · Ethereum, USDT · Ethereum e USDT · Tron), endereço com botão de copiar, QR e aviso de rede. Abre de todos os botões Deposit.',who:'Mohammad, na reunião com a UDS',date:'30/09',why:'Depósito fácil, com três opções.'},
  D67:{t:'eq',title:'Banking: protótipo com cabeçalho e histórico do Figma',body:'Fica o modelo do protótipo (blocos por moeda, faixa com os dados e painel lateral), com o cabeçalho e o histórico de transações do Figma. O print do histórico do Banking no Figma não chegou; aqui é a mesma lista do Dashboard.',who:'Mohammad, na reunião com a UDS',date:'30/09',why:'O card do Banking e os blocos agradaram.',rev:'Na segunda rodada de 30/09, o Banking sem conta voltou ao modelo do protótipo (D71).'},

  D19:{t:'mk',title:'8 ajustes em Wallets e Banking',body:'Selecionados pelo Marcos. A equipe já aplicou parte deles no Figma (visto na reauditoria de 24/09).',who:'Marcos',date:'23/09',why:'Seleção entre os problemas apontados na crítica das telas.'},
  'D19.1':{t:'mk',parent:'D19',title:'Sinais corretos no histórico',body:'Saída negativa em tinta, entrada positiva em verde. Vermelho só para erro real.'},
  'D19.2':{t:'mk',parent:'D19',title:'Saldo por moeda no Banking',body:'Revisto em 26/09 (D45): lista por moeda, sem total em USD.'},
  'D19.3':{t:'mk',parent:'D19',title:'Status e taxa no histórico',body:'Colunas próprias, com a taxa em cada linha.'},
  'D19.4':{t:'mk',parent:'D19',title:'Filtros no histórico',body:'Status, período, tipo e moeda em Transactions e no Banking; na Wallet, só período e tipo (D36).'},
  'D19.5':{t:'mk',parent:'D19',title:'Contraparte e link da transação na Wallet',body:'Coluna To/From e link para o explorer.'},
  'D19.6':{t:'mk',parent:'D19',title:'Rede em coluna própria, com nome',body:'Coluna "Asset · Network".'},
  'D19.7':{t:'mk',parent:'D19',title:'Endereço truncado no meio',body:'Formato 0x1298…299b na lista; endereço completo no Receive.'},
  'D19.8':{t:'mk',parent:'D19',title:'"Wallets" no lugar de "Active wallet"',body:'Revisto em 25/09 (D32): uma carteira só, título "Wallet".'},
  D20:{t:'mk',title:'Saldo por moeda em tabela',body:'Colunas por moeda, disponível e pendente.',rev:'Revisto em 26/09 (D45): sem a coluna em USD e sem total.',who:'Marcos',date:'23/09',why:'Escolha entre cards, abas e tabela.'},
  D21:{t:'mk',title:'Total no topo, detalhamento abaixo',body:'Total consolidado em USD, com a data da cotação; o breakdown vem logo abaixo.',rev:'Na aba Banking, revisto em 26/09 (D45): saldo por moeda, sem total em USD. Na Wallet, o total soma disponível e reservado (P24).',who:'Marcos',date:'23/09',why:'"Precisamos ter um total balance."'},
  D22:{t:'mk',title:'Explorer por ícone na linha',body:'Ícone pequeno na própria linha, sem painel lateral. Desabilitado enquanto não há hash ("Waiting for network confirmation").',who:'Marcos',date:'23/09',why:'Escolha do Marcos.',rev:'Em 30/09 o histórico em lista leva o explorer para o detalhe (P36).'},
  D23:{t:'mk',title:'Regras de rede',body:'"Asset · Network" com o nome por extenso; logo da rede no lugar das bolinhas (aqui um marcador genérico); rede em destaque no depósito; confirmação da rede no Send.',who:'Marcos',date:'23/09',why:'Aprovado pelo Marcos ("gostei").'},
  D24:{t:'mk',title:'Endereços e saldos do Figma eram placeholder',body:'Aqui cada endereço é próprio e o saldo da carteira bate com o total disponível.',who:'Marcos',date:'23/09',why:'Esclarecimento do Marcos.'},
  D25:{t:'mk',proc:1,title:'Front primeiro; brandbook e pitch no fim',body:'Reavaliar o Figma e criar o HTML do front antes de mexer em marca e deck.',who:'Marcos',date:'24/09',why:'Urgência do front.'},
  D26:{t:'mk',title:'Brief v2 é a régua',body:'Todas as telas seguem os cinco princípios do Brief (B1 a B5). O Brief ainda aguarda validação (X3).',who:'Marcos',date:'24/09',why:'A equipe externa nunca recebeu o briefing atualizado.'},
  D27:{t:'mk',proc:1,title:'Reauditoria privada',body:'As notas "Base no Figma" deste protótipo vêm da reauditoria. Não compartilhar antes da avaliação do Marcos.',rev:'Para a equipe externa, só a versão limpa do protótipo, sem pontos, índice e notas (26/09).',who:'Marcos',date:'24/09',why:'O Marcos quer avaliar tudo antes.'},
  D28:{t:'mk',proc:1,title:'Regras de horas',body:'Reuniões, chat, leitura e a auditoria de UX de setembro contam; o brandbook não.',who:'Marcos',date:'24/09',why:'Processo de sociedade.'},
  D29:{t:'mk',proc:1,title:'Reauditoria pelo Chrome',body:'Página por página, depois que o conector do Figma esgotou a cota.',who:'Marcos',date:'24/09',why:'Evitar exportar telas à mão.'},
  D58:{t:'mk',title:'Papéis no modelo da Koywe, adaptado',body:'Owner (quem abriu a conta e fez o KYB; um por empresa; transfere a titularidade e encerra a conta; segue a política de aprovação), Admin (equipe, papéis, política de aprovação, dados da empresa e pedido da conta multimoeda), Treasury Manager (aprova pagamentos, faz Send e Internal transfer, cuida da conta multimoeda), Operator (cria pagamentos, cadastra beneficiários e deposita; não aprova nem envia USDC) e Viewer (só vê e exporta). Cada papel inclui o de baixo. 2FA para todos. O convite começa no papel mais baixo e cada papel diz também o que não faz.',who:'Marcos, sobre a sugestão do Mohammad (prints da Koywe, 27/09)',date:'28/09',why:'Separa quem cria de quem aprova (quatro olhos), o que a D47 não fazia. O Superadmin "sem restrições" da Koywe virou Owner, que não pula a política. API keys, webhooks e cobranças saíram porque não estão no MVP.'},
  D59:{t:'mk',title:'Política de aprovação',body:'Quem cria um pagamento nunca o aprova (exceto na conta de um usuário). Pagamento criado por Operator precisa de aprovação; a partir de um valor, mais aprovações (aqui 2 a partir de US$ 25.000, exemplo editável pelo Admin). A última aprovação confirma com a cotação e o 2FA (P25). O aprovador vê se o beneficiário é novo e quem o cadastrou. Send e Internal transfer a partir do mesmo valor seguem a regra; a última aprovação executa o envio (auditoria de 28/09).',who:'Marcos',date:'28/09',why:'Atende o cliente da MS que exige várias aprovações e fecha o caminho de fraude do operador que cadastra a própria conta e cria o pagamento.'},
  D68:{t:'mk',title:'Menu sem Payout; Move money abre as opções',body:'Saem o botão New payout do topo do menu e o item Payout. Move money vira um grupo que abre Send, Withdraw (pagamento ao beneficiário), Deposit e Transfer (Internal transfer), como no Figma. O menu ganha as seções General, Operations e Account.',who:'Marcos, a partir do Figma validado na reunião de 30/09',date:'30/09',why:'As formas de mover dinheiro ficam num lugar só.',rev:'Na terceira rodada de 30/09: Send é o pagamento e Withdraw é o saque (D72); clicar em Move money abre a tela com as opções explicadas (D73).'},
  D69:{t:'mk',title:'Wallet mais limpa',body:'Botões na ordem Send, Deposit e Internal transfer. Sem Show QR e sem a seção de endereços de recebimento, que ficam no Deposit (D66). À direita do card, as moedas no lugar do reservado e do total.',who:'Marcos, a partir do Figma validado na reunião de 30/09',date:'30/09',why:'O endereço e o QR já aparecem no Deposit.',rev:'Na terceira rodada, saiu a lista de moedas (D74) e o Send passou a abrir o pagamento (D72).'},
  D70:{t:'mk',title:'Sem atalhos de pagamento fora do lugar',body:'Sem botão Pay na lista de beneficiários (nem no menu da linha) e sem o atalho Add no número de beneficiários do Dashboard.',who:'Marcos, a partir do Figma validado na reunião de 30/09',date:'30/09',why:'Pagar começa pelo Move money ou pelo card do Dashboard.'},
  D71:{t:'mk',title:'Banking sem conta volta ao protótipo',body:'O modelo do protótipo, em duas colunas (o que é, taxas, prazo e botão; as 14 moedas em grade), era melhor que o cabeçalho do Figma. Do Figma ficam o título "Banking account" e o histórico em lista.',who:'Marcos, a partir do Figma validado na reunião de 30/09',date:'30/09',why:'O Marcos avaliou o cabeçalho do Figma pior que o do protótipo.'},
  D72:{t:'mk',rev:'Em 06/10 (D77): o saque vai sempre para conta da própria empresa, cripto ou banco.',title:'Send paga; Withdraw saca',body:'Send abre a tela de pagamento ao beneficiário (Payout): no menu, no Move money, no card do Dashboard (no lugar de New payout) e na Wallet. Withdraw é o saque: cripto (USDC para uma carteira na Ethereum, o antigo Send USDC) ou para a conta bancária da empresa, que fica a definir (X32). Deposit segue igual. No histórico, o saque aparece como Withdrawal.',who:'Marcos, terceira rodada de 30/09',date:'30/09',why:'O Marcos definiu os nomes: Send é o pagamento; Withdraw é saque cripto ou fiat.'},
  D73:{t:'mk',title:'Move money abre as opções explicadas',body:'Clicar em Move money abre a tela com cada opção explicada, como no hub anterior: Send, Withdraw, Deposit e Transfer, na ordem do menu, mais Deposit fiat e Receive in other currencies. No protótipo, os atalhos continuam no menu, com uma seta para mostrar ou esconder (a confirmar).',who:'Marcos, terceira rodada de 30/09',date:'30/09',why:'O Marcos pediu as opções explicadas, como antes.'},
  D74:{t:'mk',title:'Wallet sem a lista de moedas',body:'Sai o quadro Assets à direita do card. O card fica com o saldo, o endereço e os botões Send, Deposit e Internal transfer.',who:'Marcos, terceira rodada de 30/09',date:'30/09',why:'Pedido do Marcos.'},
  D76:{t:'mk',title:'Transfer como no Figma: entre os saldos da própria empresa',body:'Transfer (Internal transfer) move dinheiro entre os saldos da empresa na Orval, com câmbio: entre as moedas da conta multimoeda e entre a carteira em USDC e o saldo em USD (a confirmar, X38). Taxa e cotação aparecem antes da confirmação, com 2FA. Supera a D41 (envio para outra empresa na Orval por ID ou alias).',who:'Marcos',date:'06/10',why:'"Mantenha o Transfer do jeito que está" (Figma da UDS).'},
  D77:{t:'mk',title:'Withdraw é saque para conta da própria empresa',body:'Withdraw tira o dinheiro da Orval para uma conta da própria empresa: carteira cripto (USDC na Ethereum) ou conta bancária em nome da empresa (na Taza, beneficiário com party_classification self). A conta nova passa por verificação de titularidade e pede 2FA (P55). Pagar fornecedor continua no Send.',who:'Marcos',date:'06/10',why:'"O Withdraw seria de fato um saque para uma conta fora da Orval." O Figma usa "Destination beneficiary", que é pagamento.'},
  D78:{t:'mk',title:'Send pede o que a Taza exige',body:'O Send pede a conta (método e moeda), o propósito (códigos PYR), a descrição para o banco, a referência, o documento de suporte e, no SWIFT, quem paga as tarifas (SHA ou OUR). Na China em CNY local: mercadoria com PYR022, transportadora, rastreio e itens da fatura; serviço com a fatura e um dos códigos aceitos. Resolve a X36 a favor de pedir os dados.',who:'Marcos',date:'06/10',why:'"Atualize o Send com os métodos que a Taza exige."'},
  D79:{t:'mk',title:'Rascunho espelha o design do Figma',body:'O rascunho passa a imitar o Figma da UDS (Manrope, dourado #C7A86B, cards brancos, wizard em página inteira com as etapas à esquerda, 2FA em modal, gaveta de detalhes), com as adições desta fase. Onde o Figma diverge de uma decisão, vale a decisão, e a diferença fica marcada no índice.',who:'Marcos',date:'06/10',why:'"A ideia é ter o produto final o mais próximo possível do final."'},
  D75:{t:'mk',proc:1,title:'O produto oficial é o Figma',body:'O protótipo HTML é rascunho para facilitar a comunicação. O que vale para a UDS é o Figma; o rascunho mostra propostas e decisões antes de elas irem para lá.',who:'Marcos',date:'06/10',why:'O HTML serve para facilitar a comunicação.'},
  D38:{t:'mk',title:'Home sem o total de taxas do mês',body:'Sai o card "Fees in September"; entra "Needs attention". A taxa de cada pagamento continua no resumo, na revisão, no detalhe, no histórico e no comprovante; o total do mês vai para o extrato e o CSV.',who:'Marcos',date:'25/09',why:'A Home é para operar; o total de taxas é informação de extrato.'},
  D39:{t:'mk',title:'Cripto fica fora do Pay',body:'Pay paga beneficiários em moeda local. Envio em USDC fica na Wallet (Send e Internal transfer).',who:'Marcos',date:'25/09',why:'Segue a fala do Mohammad na reunião de UI (D35).'},

  B1:{t:'br',title:'Sem linguagem de cripto',body:'Nada de gas, chain ou hash como termo principal. A rede só aparece onde erro custa dinheiro: depósito e envio.'},
  B2:{t:'br',title:'Uma ação principal: pagar',body:'Cadastrar o beneficiário e pagar em poucos passos, com revisão antes de confirmar.'},
  B3:{t:'br',title:'Tudo à vista',body:'Taxa, câmbio e prazo antes da confirmação; status e comprovante em cada transação.'},
  B4:{t:'br',title:'Rastreio de ponta a ponta',body:'O cliente sabe onde o dinheiro está: UETR, linha do tempo e selo de Credited.'},
  B5:{t:'br',title:'Dados coerentes',body:'Saldos que somam e sinais corretos em todas as telas. Aqui os números da Home saem do próprio histórico.'},

  P1:{t:'pr',title:'Um único fluxo "Pay"',body:'Substitui Create payout, Send, Withdraw e Move money (cinco fluxos com taxas diferentes no Figma). Envio em USDC fica na Wallet (D35, D39). Move money vira hub de atalhos (P22).',src:'Reauditoria de 24/09',rev:'Em 30/09 o envio em USDC virou Withdraw, no Move money (D72).'},
  P2:{t:'pr',title:'Revisão em uma etapa',body:'Composição das taxas (D56), câmbio com cotação de 60 segundos, valor que o beneficiário recebe, prazo e 2FA no botão de confirmar.',rev:'No v2 a cotação valia 10 minutos; o documento de payout mostra "válida por 00:58".',src:'Reauditoria de 24/09'},
  P3:{t:'pr',title:'Acompanhamento com rastreio e Credited',body:'Linha do tempo, UETR (SWIFT) ou referência de rastreio (local), comprovante da Orval e selo Credited.',rev:'MT103 saiu em 26/09 (D55).',src:'Reauditoria de 24/09 e Brief v2'},
  P4:{t:'pr',title:'Saldo insuficiente avisado na hora',body:'Aviso junto do valor, antes de avançar, com atalho para Deposit.',src:'Reauditoria de 24/09'},
  P5:{t:'pr',title:'Referência, invoice e e-mail opcionais',body:'Campos opcionais no pagamento. O e-mail do beneficiário vem do cadastro. A invoice ajuda a revisão de compliance.',src:'Reauditoria de 24/09'},
  P6:{t:'pr',title:'Um histórico só: Transactions',body:'Payouts list fundida com a gaveta de detalhe do Dashboard: pagamentos, depósitos e envios no mesmo lugar, com taxa, status e filtros.',src:'Reauditoria de 24/09'},
  P7:{t:'pr',title:'Beneficiários prontos para pagar',body:'Colunas país, moeda, método e status, e botão "Pay" em cada linha. Uma única versão da lista.',src:'Reauditoria de 24/09'},
  P8:{t:'pr',title:'Cadastro: país primeiro, campos por país',body:'Depois o método (Swift ou local) e a moeda. Registro da empresa e e-mail opcionais. Sem carteira cripto como método (D39). Aviso de conta duplicada mantido do Figma.',src:'Reauditoria de 24/09'},
  P9:{t:'pr',title:'Home com Pay e Deposit',body:'Sem gráfico de USDT/ETH. Saldo, o que pede atenção (D38), números do mês, pagamentos recentes e atalhos.',rev:'Aprovações pendentes voltaram com a D47.',src:'Reauditoria de 24/09'},
  P10:{t:'pr',title:'Cadastro só de empresa',body:'Sem Personal account nem "Switch to personal". O cadastro pede empresa, país e cargo; senha com mínimo de 12 caracteres e sem limite máximo.',src:'Auditoria de 02/09 e reauditoria de 24/09'},
  P11:{t:'pr',title:'KYB completo e retomável',body:'Dados da empresa com RUC, diretores e UBOs separados, documentos, revisão com Edit, status com prazo e "Save and continue later". Prazos exibidos são exemplo.',src:'Reauditoria de 24/09'},
  P12:{t:'pr',title:'Verificação de e-mail sem beco sem saída',body:'Trocar e-mail, reenviar com contador, validade do código e estado de verificado.',src:'Reauditoria de 24/09'},
  P13:{t:'pr',title:'Desativar é reversível',rev:'Em 06/10: a Taza não apaga beneficiário; desativar continua sendo a forma de tirar da lista (P48).',body:'Status Inactive e botão Reactivate. Histórico preservado.',src:'Reauditoria de 24/09'},
  P14:{t:'pr',title:'Exemplos paraguaios',body:'Empresa de Asunción, RUC e documentos locais nos exemplos. Nomes, câmbios e valores são fictícios.',src:'Reauditoria de 24/09'},
  P15:{t:'pr',title:'A Orval escolhe a rota',body:'O cliente paga do saldo disponível, sem escolher carteira de origem nem tipo de trilho.',src:'Reauditoria de 24/09'},
  P16:{t:'pr',title:'E-mail do beneficiário',body:'Valor, remetente, referência, rastreio e comprovante; rodapé "Sent with Orval" divulga a marca (motivo do D10).',src:'Reauditoria de 24/09'},
  P17:{t:'pr',title:'Recuperação de acesso',body:'"Forgot password?" no login e saída para quem perdeu o autenticador. Hoje não existe no Figma.',src:'Reauditoria de 24/09'},
  P18:{t:'pr',st:'sup',title:'Pergunta de intenção no cadastro',body:'"Só pagar fornecedores" seguia a aplicação básica; "também receber em outras moedas" abria a aplicação da conta multimoeda.',rev:'Superada pela D57 (26/09): onboarding básico e aplicação leve depois.',src:'Chat de 25/09'},
  P19:{t:'pr',st:'sup',title:'Internal transfer por ID ou alias',body:'O cliente digita o ID Orval (numérico) ou o alias do destinatário e vê o nome da empresa antes de enviar.',rev:'No v2 era e-mail ou ID; mudou com a D41. Superada em 06/10 pela D76: o Transfer passou a ser entre os saldos da própria empresa.',src:'Protótipo v2'},
  P20:{t:'pr',st:'sup',title:'Conversão pendente sempre à vista',body:'USDT que chegava e não era aprovado ficava fora do saldo até o cliente aprovar.',rev:'Superada pela D40: não há mais conversão esperando aprovação.',src:'Protótipo v2'},
  P21:{t:'pr',st:'ok',title:'Regra do fiat pelo tipo de conta',body:'Sem conta multimoeda, depósito em fiat vira USDC; com a conta aprovada, fica na moeda, custodiado pelo banco em nome do cliente.',rev:'Confirmada em 26/09 (D43 e D44).',src:'Protótipo v2'},
  P22:{t:'pr',st:'ok',title:'Move money como hub',body:'Reúne as formas de mover dinheiro (pagar fornecedor, Send, Internal transfer, depósitos e conta multimoeda) numa página de atalhos. Mantém o menu do Figma (D51) sem voltar aos cinco fluxos (P1).',src:'Protótipo v3',rev:'Em 30/09 o Move money virou um grupo no menu (D68); a tela do hub fica parada até o Mohammad validar o design. Na terceira rodada de 30/09, a tela voltou: Move money abre as opções explicadas (D73).'},
  P23:{t:'pr',title:'Revisão de compliance antes da confirmação',body:'Status "In review" enquanto o compliance analisa; depois o pagamento volta para ser confirmado com a cotação do momento. Beneficiário em whitelist, dentro do teto, pula a revisão. O app não mostra o teto ao cliente: mostrar incentiva fracionar pagamentos.',src:'Documento de payout (03a e 03b) e protótipo v3'},
  P24:{t:'pr',title:'Saldo reservado à vista',body:'Na Wallet: disponível, reservado para pagamentos e envios em andamento, e total. Confirmar move o valor de disponível para reservado; o envio ao banco consome a reserva.',src:'Documento de payout (saldos do ledger)',rev:'Em 30/09 saiu da tela da Wallet (D69); continua no card da wallet no Dashboard (P35).'},
  P25:{t:'pr',title:'Aprovar é confirmar',body:'Quem aprova confirma com a cotação do momento e o 2FA, num passo. O Operador envia para aprovação; na conta de um usuário, "Pay and approve" faz tudo (D47).',src:'Protótipo v3'},
  P26:{t:'pr',st:'ok',title:'Dashboard em duas colunas',body:'Da UDS: os detalhes do saldo saem do card principal e vão para uma coluna à direita, junto com o card do Banking, o que precisa de atenção e os beneficiários frequentes (D49). O card principal fica com New payout e Deposit (D48); o Send fica na Wallet. O olho no card esconde os saldos, no mesmo estado do cabeçalho. Beneficiaries ganha o atalho Add beneficiary.',src:'Avaliação do Figma da UDS (29/09)',rev:'Em 30/09 o atalho Add saiu (D70).'},
  P27:{t:'pr',st:'ok',title:'Sem botão de troca de saldo',body:'A UDS propôs alternar wallet e Banking no mesmo número. Aqui os dois aparecem juntos: o card principal é a wallet, que paga fornecedor, e o Banking tem card próprio, por moeda, sem total em USD (D45). O cabeçalho mantém o Available to pay (D50).',src:'Avaliação do Figma da UDS (29/09)',rev:'Confirmado em 30/09: sem botão de troca; a moeda de exibição fica nas configurações do usuário (D64).'},
  P28:{t:'pr',st:'ok',title:'Aprovar abre o pagamento',body:'A lista de aprovações pendentes não tem Approve nem Reject. A linha mostra método e moeda (não rede), quem criou, quantas aprovações já tem e se o beneficiário é novo, e abre o detalhe, onde se aprova com 2FA (P25, D59).',src:'Avaliação do Figma da UDS (29/09)',rev:'Confirmado em 30/09 com o botão Review (D60).'},
  P29:{t:'pr',st:'ok',title:'Dados da conta em painel lateral',body:'Na página fica uma faixa com o resumo (titular, número mascarado, SWIFT) e o botão. O painel abre com o aviso de compliance (D46), cujo aceite libera ver, copiar e baixar; tem Copy all e Download PDF, porque o uso principal é mandar os dados ao cliente lá fora.',src:'Avaliação do Figma da UDS (29/09)'},
  P30:{t:'pr',title:'Cada saldo com o próprio histórico',body:'Wallet: só movimentos cripto (depósito em cripto, conversão de USDT, Send e Internal transfer), como o Marcos pediu em 29/09. Banking: só a conta multimoeda, na moeda de cada linha. Transactions junta tudo: pagamentos, depósitos, envios e, quando a conta existe, a conta multimoeda.',src:'Avaliação do Figma da UDS (29/09)'},
  P31:{t:'pr',st:'ok',title:'Banking sem conta em duas colunas',body:'Esquerda: o que é, taxas, prazo e botão. Direita: as 14 moedas em grade, com bandeiras circulares de um set único. Resolve o card vazio pela metade e as bandeiras desiguais do Figma.',src:'Avaliação do Figma da UDS (29/09)',rev:'Em 30/09 o cabeçalho do Figma, com as moedas em fichas, substituiu as duas colunas (D67). Voltou na segunda rodada de 30/09 (D71).'},
  P32:{t:'pr',title:'Atenção no topo',body:'O que precisa de atenção abre a coluna da direita, ao lado do card principal, com cara de aviso; some quando não há nada. Em telas menores vem logo depois do card.',src:'Avaliação do v3.1 (29/09)',rev:'Em 30/09 o quadro ficou no topo da coluna da direita (D62); o nome está em aberto (X29).'},
  P33:{t:'pr',st:'ok',title:'Saldos da conta multimoeda em blocos',body:'Cada moeda com saldo vira um bloco; "Show all" acrescenta as outras em blocos apagados, sem abrir buraco ao lado. Os dados da conta ficam numa faixa com o botão do painel (P29). No Dashboard aparecem as 3 moedas de movimento mais recente e "+N" para as outras.',src:'Avaliação do v3.1 (29/09)'},
  P34:{t:'pr',st:'sup',title:'"Needs attention" no lugar de "My tasks"',rev:'Superada em 06/10 pela P49: com só ações na lista, "My tasks", o nome do Figma, serve.',body:'O quadro é de aviso: confirmar, aprovar, atualizar beneficiário. "My tasks" com contador (0/2) sugere uma lista que acaba, como um checklist de cadastro. Recomendação: "Needs attention", com o número de itens; cada item com ícone, título e descrição; some quando não há nada.',src:'Reunião de 30/09 (Mohammad e UDS)'},
  P35:{t:'pr',title:'Card da wallet cripto',body:'Substitui os detalhes do saldo: o ativo (USDC na Ethereum) com o total, o disponível e o reservado. O USDT depositado vira USDC, então hoje há um ativo só.',src:'Reunião de 30/09 (Mohammad e UDS)'},
  P36:{t:'pr',title:'Um só componente de histórico',body:'A lista do print do Figma serve ao Dashboard, à Wallet e ao Banking, com filtros e 5 itens por página. O ícone do explorer sai da linha e fica no detalhe (D22).',src:'Reunião de 30/09 (Mohammad e UDS)'},
  P37:{t:'pr',st:'sup',title:'Card principal com New payout',body:'O Figma ainda mostra Send e Deposit. Aqui continua New payout e Deposit (D48); o Send fica na Wallet. Confirmar.',src:'Reunião de 30/09 (Mohammad e UDS)',rev:'Superada: o card usa Send, que abre o pagamento (D72).'},
  P38:{t:'pr',title:'Frequent beneficiaries fora do Dashboard',body:'O modelo de 30/09 não tem o card de frequentes (D49). Saiu para não pesar a tela; confirmar se volta em outro lugar, por exemplo no início do New payout.',src:'Reunião de 30/09 (Mohammad e UDS)'},
  P39:{t:'pr',title:'Avisos no Deposit simples',body:'Uma linha de compliance (D46) e, no USDT, que ele vira USDC ao chegar, com a cotação no histórico. O modal não mostra cotação antes do envio (muda a D40, X31).',src:'Reunião de 30/09 (Mohammad e UDS)'},
  P40:{t:'pr',st:'sup',title:'"Apply" no botão do Banking',body:'O Figma diz "Active multi-currency account". Como a conta passa por análise de até 72 horas, "Apply for a multi-currency account" descreve o que acontece.',src:'Reunião de 30/09 (Mohammad e UDS)',rev:'Superada: o Banking sem conta voltou ao protótipo, que já usa "Apply" (D71).'},
  P41:{t:'pr',st:'sup',title:'"Withdraw" para pagar fornecedor',body:'No menu do Figma, o pagamento ao beneficiário se chama Withdraw. Para quem usa, "withdraw" é tirar o dinheiro para a própria conta, não pagar um fornecedor. Recomendação: "Payout" ou "Pay a supplier". Aqui segue o Figma; o fluxo continua com o título Payout.',src:'Reunião de 30/09',rev:'Superada: Withdraw agora é o saque, e o pagamento se chama Send (D72).'},
  P42:{t:'pr',st:'sup',title:'Moedas no card da Wallet',body:'À direita do card: USDC na Ethereum com o saldo; USDT na Ethereum e na Tron com "Becomes USDC", porque o USDT vira USDC ao chegar (D40). Se a equipe quiser guardar USDT como está, esta lista passa a ter saldo por moeda.',src:'Reunião de 30/09',rev:'Superada: a lista de moedas saiu do card (D74).'},
  P43:{t:'pr',title:'Pedido das contas em quatro passos',body:'Empresa: dados do cadastro, só para confirmar, mais o número de registro, obrigatório na Taza. Verificação: só o que falta do KYB completo (estrutura societária, comprovantes de endereço, sócios com mais de 25%, diretores e representante, faturamento); ata e declaração só quando cabem. Recebimento: contas, valor e número de recebimentos por mês, países e moedas, quem paga e por quê, origem dos recursos e faturas opcionais. Aceites: taxas por conta, termos e o compromisso da D46. Dá para salvar e terminar depois (vira a tarefa Finish application).',src:'Proposta de 06/10, item 1.2 (documentação da API da Tazapay)'},
  P44:{t:'pr',title:'Contas oferecidas, com três já marcadas',body:'O app mostra as contas que a Taza liberar para o cliente. Marcadas: a multimoeda SWIFT de Singapura (as 14 moedas), USD local (ACH e Fedwire) e EUR local (SEPA). A um clique: GBP local, a multimoeda SWIFT do Reino Unido (26 moedas) e as locais de CAD, AUD, SGD, DKK, AED, NGN e PHP. Depois da aprovação, "Add an account" pede outras sem refazer o cadastro.',src:'Proposta de 06/10, item 1.3'},
  P45:{t:'pr',title:'Dados de cada conta pelo tipo',body:'Comuns: titular, banco, endereço do banco, tipo (local ou SWIFT), moedas aceitas, limite por pagamento, Copy all e PDF. Número da conta ou IBAN e os códigos que a Taza devolver, com nomes fixos: SWIFT / BIC, ACH routing number, Wire routing number, Routing code, Sort code, BSB e Bank code. Sem campo de referência, porque cada conta é exclusiva do cliente. Sai "Account holder address", que a Taza não devolve.',src:'Proposta de 06/10, item 1.4'},
  P46:{t:'pr',title:'Status de cada conta',body:'In review (pedido em análise), Action needed (a Taza pediu documento; vira tarefa), Active, Not approved (recusado ou cancelado) e Closed (desativada). Cada conta aparece com o próprio status no pedido e no Banking.',src:'Proposta de 06/10, item 1.4'},
  P47:{t:'pr',title:'Dados bancários travados depois do primeiro pagamento concluído',body:'Regra da Taza: depois do primeiro pagamento concluído, nome, tipo, país, conta ou IBAN e códigos bancários existentes não mudam. Regra da Orval: titular da conta e moeda ou método também não. Continuam editáveis: e-mail do comprovante, endereço sem o país, nome do banco, agência e tipo de conta. Tax ID muda com nova revisão do compliance. Antes do primeiro pagamento, tudo edita. Na lista, o cadeado mostra quem já está travado.',src:'Proposta de 06/10, item 2 (página do PUT de beneficiário da Taza)'},
  P48:{t:'pr',title:'Trocar dados bancários cria beneficiário novo',body:'"Replace bank details" abre o cadastro com o nome e o contato preenchidos. Ao salvar, com 2FA, o app cria o beneficiário novo e desativa o antigo, que mantém o histórico e pode ser reativado. O novo conta como beneficiário novo: aviso a quem aprova (D59) e revisão do compliance no primeiro pagamento (P23). Excluir não existe na Taza: vira Deactivate. Pagamento em andamento não muda. Operator para cima edita; Viewer só vê. Falha ou devolução por dado do beneficiário (PF02, PR1001 a PR1004) marca "Needs update" e gera tarefa que leva direto à troca. O Tazamatch confere o nome do titular onde houver cobertura.',src:'Proposta de 06/10, item 2'},
  P49:{t:'pr',title:'My tasks só com ações',body:'Só entra o que exige ação de quem está logado; cada item tem botão e prazo e some quando resolvido. Nove tipos: Approve payment, Confirm payment, Send requested documents, Complete company verification, Finish application, Complete account application, Payment needs action, Update beneficiary e Add funds. Status e avisos vão para o histórico. Ordem: atrasadas, vencem em 24 horas, demais. Aprovação e saldo ficam na Orval: o pagamento só vai para a Taza depois da última aprovação e com o saldo coberto. Com essa regra, "My tasks", o nome do Figma, serve (supera a P34).',src:'Proposta de 06/10, item 3'},
  P51:{t:'pr',title:'Beneficiário no modelo do Figma, sem carteira cripto',body:'Um beneficiário (dados da empresa ou da pessoa) com uma ou mais contas bancárias, como no Figma, mas sem carteiras USDC (D39). Cada conta tem status e cadeado depois do primeiro pagamento (P47); trocar dados cria conta nova com 2FA (P48). Na lista: coluna Status (o Figma tinha o filtro e não a coluna), Address e Tax ID nos rótulos e Deactivate no lugar de Remove. Tipo Individual no lugar de Personal account.',src:'Espelho do Figma, 06/10'},
  P52:{t:'pr',title:'Banking no visual do Figma, com as regras já decididas',body:'Várias contas, cada uma com o próprio status (P46), no lugar de uma conta para as 14 moedas. Sai o card "Total balance" (D45: sem total em USD), sai "Up to 72 hours" (prazo sem base, X33) e sai "Account holder address" (P45). Entra o card "Your accounts", com "View details" em cada conta.',src:'Espelho do Figma, 06/10'},
  P53:{t:'pr',title:'Textos do Figma corrigidos',body:'"Update informations" e "Suport" corrigidos; "Adress" vira "Address"; "Data range" vira "Date range"; "CNPJ / Tax ID" vira "Tax ID", sem o Brasil no rótulo; "Representative\'s name (optional)" sem asterisco; "Active multi-currency account" vira "Apply for accounts"; "This usually takes a few minutes" sai do aviso de verificação; "Non-custodial" sai do rodapé do login.',src:'Espelho do Figma, 06/10'},
  P54:{t:'pr',title:'Origem do Send e do Withdraw: carteira ou saldo em moeda',body:'Com a conta multimoeda ativa, o Send e o Withdraw podem sair da carteira em USDC ou do saldo de uma moeda (na Taza, holding_currency). Sem a conta, só a carteira.',src:'Espelho do Figma, 06/10 (o Figma tem "Origin wallet" em EUR)'},
  P55:{t:'pr',title:'Contas de saque da empresa',body:'O Withdraw só vai para contas cadastradas em nome da empresa: banco (país, método, conta e SWIFT, titular travado na razão social) ou carteira USDC na Ethereum. Cadastro com 2FA e declaração de titularidade; a conta fica "In review" até a verificação.',src:'Espelho do Figma, 06/10'},
  P56:{t:'pr',title:'Transfer: pares, taxa e sem aprovação',body:'Pares: qualquer moeda da conta multimoeda entre si; a carteira em USDC só com o saldo em USD. Taxa de exemplo de 0,20%, cotação travada por 60 segundos e 2FA. Como move dinheiro entre contas da própria empresa, não passa pela política de aprovação.',src:'Espelho do Figma, 06/10'},
  P57:{t:'pr',title:'Acesso só para empresa',body:'Sai a escolha "Business ou Personal" do cadastro do Figma. Login com Google e Apple aparece como no Figma, mas o código do autenticador continua obrigatório (X40). Rodapé "Protected with two-step verification." no lugar de "Encrypted end-to-end. Non-custodial."',src:'Espelho do Figma, 06/10'},
  P58:{t:'pr',title:'Detalhes em gaveta e página completa',body:'Clicar numa transação abre a gaveta "Transaction details" do Figma (detalhes, resumo do valor e recibo). "View full details" abre a página com a linha do tempo, as aprovações, o rastreio e os e-mails.',src:'Espelho do Figma, 06/10'},
  P59:{t:'pr',title:'Paraguai só por SWIFT no rascunho',body:'Beneficiário e conta de saque no Paraguai só por SWIFT, em USD ou PYG, como na planilha da Taza (X37).',src:'Espelho do Figma, 06/10'},
  P50:{t:'pr',title:'My tasks no Dashboard e em tela própria',body:'No Dashboard, até 3 tarefas e "View all"; a tela lista todas, agrupadas por prazo, e mostra só o que cabe ao papel de quem está logado. Sem tarefas, o card diz que não há nada a fazer, como o estado "No Tasks" do Figma. O Figma de 06/10 tem o card sem "View all" e sem entrada no menu.',src:'Proposta de 06/10, item 3, e Figma de 06/10'},

  X1:{t:'pd',title:'Banking (produto 2): taxas, termos e elegibilidade',rev:'Em 06/10: o pedido virou proposta em quatro passos (P43) e o que só a Taza responde sobre as contas ficou na X33.',owner:'Mohammad e Gabriel',due:'a definir',blocks:'Aba Banking. Moedas (14) e custódia no OCBC definidas. Faltam jurisdições e segmentos aceitos pela Tazapay, taxa de abertura e mensalidade, termos (Unified como MSB) e se o cliente paga direto do saldo em moeda.'},
  X2:{t:'pd',title:'Pay-in em fiat (on-ramp) com a Tazapay',owner:'Mohammad, com a Tazapay',due:'a definir',blocks:'Aba Fiat do Deposit. Nunca foi feito. Falta o detalhe por moeda: dados, custo, cotação, prazos e limites. Aqui as moedas, a cotação e os dados são exemplo.'},

  X14:{t:'pd',novo:1,title:'Prazos e custos reais por rota',owner:'Mohammad e Luis, com a Tazapay',due:'a definir',blocks:'Prazos exibidos são estimativa. As taxas de pagamento vêm do documento de payout em BRL (7), ACH (3) e SWIFT (40); CNY (6), SEPA (4) e Paraguai (2) são inventadas.'},

  X19:{t:'pd',st:'ok',title:'Onboarding básico ou completo',owner:'Mohammad e Gabriel',due:'26/09',blocks:'Cadastro.',rev:'Resolvida em 26/09 (D57): básico, com a conta multimoeda depois.'},
  X20:{t:'pd',st:'ok',title:'Taxa por fora ou descontada',owner:'Mohammad',due:'26/09',blocks:'Resumo do Pay.',rev:'Resolvida: por fora. O documento de payout debita valor + fee + taxa de pagamento (D56).'},
  X21:{t:'pd',title:'Gas na Ethereum',owner:'Mohammad e Luis',due:'a definir',blocks:'Envios pagam a taxa de rede (D42). Nos pagamentos, o gas do lote enviado ao PSP é da Orval; confirmar o custo frente à margem.'},
  X22:{t:'pd',st:'sup',rev:'Superada em 06/10 pela D76: com o Transfer entre os saldos da própria empresa, o câmbio acontece na Taza, sem rede.',novo:1,title:'Internal transfer: book transfer ou on-chain',owner:'Mohammad, com a UDS',due:'28/09',blocks:'Internal transfer. O documento de payout (v4.0) diz book transfer, sem gas nem hash, e registra que a evidência de implementação está pendente; a reunião de 26/09 decidiu on-chain com taxa de rede (D41, D42). Aqui segue a D41.'},
  X23:{t:'pd',novo:1,title:'Conversão de USDT fora do escopo da UDS',owner:'Mohammad, com a UDS',due:'28/09',blocks:'Depósito em USDT (D31, D40). A conexão com exchange ou provedor de liquidez (OKX, MEXC, B2C2) aguarda orçamento da UDS e está fora do escopo. A versão em inglês do documento fala em swaps da DFNS e diz que USDT na Tron não tem rota. Sem isso, o USDT não vira USDC.'},
  X24:{t:'pd',novo:1,title:'Travel rule no depósito',owner:'Gabriel',due:'a definir',blocks:'Depósito em cripto. O documento aplica travel rule a partir de CAD 1.000 e reporte a partir de CAD 10.000 em 24 horas. Falta definir o que o cliente informa (carteira própria ou exchange) e em que momento.'},
  X25:{t:'pd',novo:1,title:'Ordem: compliance, aprovação e cotação',owner:'Mohammad e Gabriel, com a UDS',due:'28/09',blocks:'Pay. No documento, o compliance aprova antes de o cliente confirmar a ordem (03b); a D47 cria aprovações dentro da empresa. Proposta aqui (P23, P25): compliance primeiro, depois o aprovador confirma com a cotação e o 2FA. Falta o prazo da revisão e o que o cliente vê enquanto espera.'},
  X27:{t:'pd',novo:1,title:'Verificação de identidade de quem move dinheiro',owner:'Gabriel',due:'a definir',blocks:'Convite de membros. Treasury Manager, Admin e Owner aprovam pagamentos e enviam USDC: precisam de verificação de identidade como os diretores no KYB?'},
  X28:{t:'pd',novo:1,proc:1,title:'Sessão na Koywe e na Mesta com o Mohammad',owner:'Marcos e Mohammad',due:'a definir',blocks:'Ver a tela de política de aprovação, o convite, o que o aprovador vê no pagamento e se o Superadmin da Koywe pula a política.'},
  X26:{t:'pd',novo:1,title:'Taxa: 0,40% ou tiers',owner:'Mohammad',due:'antes do pitch',blocks:'Resumo do Pay, login e pitch. A D4 fala em 0,40%; o documento traz fee de 0,20% (tier 1) ou 0,30% (tier 2), spread de 0,10% no câmbio e taxa de pagamento por rail (3 a 40 USDC). Hipótese a confirmar: 0,40% seria o custo total. Os exemplos do documento divergem entre si (a memória de cálculo usa 0,50% e 2,04%).'},
  X29:{t:'pd',novo:1,title:'Nome do quadro de alertas',rev:'Proposta de 06/10 (P49): a lista fica só com ações e, com isso, "My tasks", que é o nome do Figma. Fecha quando a equipe aprovar.',owner:'Equipe, com a recomendação do Marcos (P34)',due:'a definir',blocks:'Dashboard: "My tasks" ou "Needs attention".'},
  X30:{t:'pd',novo:1,title:'Depósito em fiat fora do Deposit simples',owner:'Mohammad',due:'a definir',blocks:'O modal de 30/09 só tem cripto. O pay-in em fiat (D43) continua em tela própria, aberta pelo Move money; falta decidir se fica no MVP e onde aparece.'},
  X31:{t:'pd',novo:1,title:'Cotação do USDT antes do envio',owner:'Mohammad',due:'a definir',blocks:'Deposit. A D40 mostrava a cotação e quanto chega em USDC antes do envio; o modal simples não mostra. Sem isso, a conversão é pela taxa na chegada (X18).'},
  X32:{t:'pd',novo:1,title:'Saque fiat (Withdraw para conta bancária)',rev:'Em 06/10: pela planilha da Taza, o Paraguai só recebe por SWIFT (X37). A D77 define o destino (conta da própria empresa) e a X39 junta o que falta.',owner:'Mohammad',due:'a definir',blocks:'Withdraw. Falta definir para qual conta vai (só a conta da empresa, verificada no cadastro?), moedas, custo, prazo, limites e aprovação. O protótipo mostra a opção e avisa que ainda não está disponível.'},
  X33:{t:'pd',novo:1,title:'Contas de recebimento: o que só a Taza responde',owner:'Marcos e Mohammad, com a Taza',due:'depois da gravação',blocks:'Pedido e tela das contas. Se o titular é a razão social do cliente (o app promete "in your company\'s name"); se empresa paraguaia pode ser titular e em quais domicílios; se a regra de uma conta do mesmo tipo por país (erro 6133) vale por cliente ou pela Orval; saldo por moeda (D45), que depende de a Orval habilitar cada moeda; prazo real de análise e ativação (o rascunho dizia 72 horas, sem base); se o KYB básico (D57) basta ou é preciso atualizar o cadastro na Taza; se o número de registro é o RUC; que códigos vêm em cada moeda (validar no sandbox); banco da conta de Singapura (OCBC ou Standard Chartered); domicílio do EUR local (Luxemburgo ou Reino Unido); elegibilidade de Paraguai e do setor, pela consulta de metadata.'},
  X34:{t:'pd',novo:1,title:'Beneficiários: o que confirmar com a Taza',owner:'Marcos, com a Taza',due:'depois da gravação',blocks:'Edição de beneficiário. Se o "Country" travado é o do banco ou o do endereço (até lá, mudar o país do endereço depois do pagamento também pede beneficiário novo); se nome do banco, agência, titular e tipo de conta mudam depois do pagamento; se a edição dispara nova checagem; cobertura e custo do Tazamatch, que não cobre fornecedor empresa na China.'},
  X35:{t:'pd',novo:1,title:'Pedidos de informação sem API na Taza',owner:'Mohammad, com a UDS e a Taza',due:'a definir',blocks:'Tarefas de documentos (pagamento, KYB e pedido de conta) e ação pedida no pagamento. A Taza não tem API nem webhook de pedido de informação (o RFI Center ainda não saiu), nem caminho documentado para mandar documento do KYB ou do pedido de conta. Proposta: backoffice com "Pedir informação ao cliente" (o compliance cria o pedido com prazo e lista de documentos, o cliente responde no app e o compliance repassa à Taza). Confirmar com a UDS se está no escopo (o contrato prevê backoffice de compliance com KYB queue, cases e alerts) e assinar os webhooks payout.requires_action e payout.requires_approval, que vêm desligados.'},
  X36:{t:'pd',novo:1,st:'ok',rev:'Resolvida em 06/10 (D78): o Send pede os dados.',title:'China em CNY local: dados extras no Send ou SWIFT em USD',owner:'Mohammad',due:'a definir',blocks:'Send e cadastro de beneficiário na China. Em CNY local, a Taza pede, na mercadoria, o código PYR022, a transportadora, o número de rastreio e os itens da fatura; no serviço, a fatura antes do envio e um dos 14 códigos de propósito. Do fornecedor: nome em chinês, código de crédito social (USCC), titular igual ao do banco e celular chinês. Decidir se o Send pede esses dados nesse corredor ou se o pagamento vai por SWIFT em USD.'},
  X37:{t:'pd',novo:1,title:'Paraguai só por SWIFT na Taza',owner:'Marcos, com a Taza',due:'depois da gravação',blocks:'Beneficiário paraguaio e saque fiat (X32). Pela planilha, a Taza só paga para o Paraguai por SWIFT (PYG; USD, CHF e MXN a confirmar), sem rede local; a documentação não cita o país. O beneficiário paraguaio por rede local deste rascunho não existe na Taza. Confirmar na consulta de corredores (metadata de payout para PY).',rev:'No espelho de 06/10, o rascunho já mostra o Paraguai só por SWIFT (P59).'},
  X38:{t:'pd',novo:1,title:'Transfer: moedas e câmbio na Taza',owner:'Marcos, com a Taza',due:'a definir',blocks:'Transfer (D76). Quais moedas a Orval mantém na Taza para cada cliente, se o câmbio entre saldos é instantâneo, a taxa e se dá para converter USDC em saldo em USD (e o contrário) dentro da Taza.'},
  X39:{t:'pd',novo:1,title:'Saque para conta da própria empresa',owner:'Mohammad, com a Taza',due:'a definir',blocks:'Withdraw (D77). Como verificar a titularidade da conta (documento, Tazamatch), países e moedas aceitos, taxa e prazo do payout com party_classification self, limites e se pede aprovação. Junta a X32.'},
  X40:{t:'pd',novo:1,title:'Login com Google e Apple',owner:'Sócios',due:'a definir',blocks:'Login (P57). O Figma tem os botões; a X10 deixava de fora. Se ficar, o código do autenticador continua obrigatório depois do login social.'}

/* ===================== utilitários ===================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((Number(n)+Number.EPSILON)*100)/100;
const nf=(n,d=2)=>Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const SYM={USD:'$',EUR:'€',BRL:'R$',GBP:'£'};
function money(n,cur,o){cur=cur||'USD';o=o||{};const a=Math.abs(n);const s=n<0?'-':(o.sign&&n>0?'+':'');const sym=SYM[cur],d=(cur==='JPY'||cur==='PYG')?0:2;return sym&&!o.code?s+sym+nf(a,d):s+cur+' '+nf(a,d);}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const p2=n=>String(n).padStart(2,'0');
function pd(iso){const [d,t]=iso.split('T');const [y,m,dd]=d.split('-').map(Number);const [h,mi]=(t||'00:00').split(':').map(Number);return {y,m,d:dd,h,mi};}
function fd(iso){const x=pd(iso);return MON[x.m-1]+' '+x.d+', '+x.y;}
function fds(iso){const x=pd(iso);return MON[x.m-1]+' '+x.d;}
function ft(iso){const x=pd(iso);return p2(x.h)+':'+p2(x.mi);}
function fdt(iso){return fd(iso)+' · '+ft(iso);}
/* a data do protótipo é fixa (TODAY); só a hora vem do relógio */
function nowIso(){const d=new Date();return TODAY+'T'+p2(d.getHours())+':'+p2(d.getMinutes());}
function addMin(iso,m){const x=pd(iso);const d=new Date(x.y,x.m-1,x.d,x.h,x.mi+m);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'T'+p2(d.getHours())+':'+p2(d.getMinutes());}
const short=a=>a?a.slice(0,6)+'…'+a.slice(-4):'';
function hex(n){let s='';const c='0123456789abcdef';for(let i=0;i<n;i++)s+=c[Math.floor(Math.random()*16)];return s;}
function uuid4(){const h=hex(32).split('');h[12]='4';h[16]='89ab'[Math.floor(Math.random()*4)];const s=h.join('');return s.slice(0,8)+'-'+s.slice(8,12)+'-'+s.slice(12,16)+'-'+s.slice(16,20)+'-'+s.slice(20);}
function parseAmt(v){const s=String(v||'').replace(/[,\s]/g,'');if(!/^\d*\.?\d{0,2}$/.test(s)||s===''||s==='.')return NaN;return Number(s);}
function rateText(cur){if(cur==='USD')return 'No conversion';if(cur==='EUR')return '1 EUR = '+nf(1/RATES.EUR,4)+' USD';return '1 USD = '+nf(RATES[cur],cur==='PYG'?0:4)+' '+cur;}
function rateTextFor(cur,rate){if(cur==='USD')return 'No conversion';if(cur==='EUR')return '1 EUR = '+nf(1/rate,4)+' USD';return '1 USD = '+nf(rate,cur==='PYG'?0:4)+' '+cur;}
const initials=n=>n.replace(/[^A-Za-zÀ-ÿ ]/g,'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();

  return '<nav class="pager" aria-label="Pages">'+b(page-1,ic('chevL',16),'Previous page',page<=1)+L.map(x=>x===0?'<span class="pg-gap" aria-hidden="true">…</span>':b(x,String(x),'Page '+x,false,x===page)).join('')+b(page+1,ic('chevR',16),'Next page',page>=pages)+'</nav>';}

/* ===================== dados derivados ===================== */
const ben=id=>S.bens.find(b=>b.id===id);
const wal=id=>S.wallets.find(w=>w.id===id);
const txById=id=>S.txs.find(t=>t.id===id);
const avail=()=>r2(S.wallets.reduce((a,w)=>a+w.bal,0));
const isSwift=t=>{const b=ben(t.ben);return !!b&&b.m==='SWIFT';};
function methodLabel(b){return b.m==='SWIFT'?'SWIFT':(b.rail?'Local · '+b.rail:'Local transfer');}
function mLabel(m){return m.m==='SWIFT'?'SWIFT':(m.rail?'Local · '+m.rail:'Local transfer');}
const DONE_BAD=['Returned','Failed','Cancelled'];
const PRE=['In review','Awaiting approval','Ready to confirm'];
const role=()=>S.who==='single'?'owner':S.who;
const rank=()=>RANK[role()];
/* o que cada papel pode fazer (D58); cada papel inclui o de baixo */
const can={pay:()=>rank()>=1,approve:()=>rank()>=2,send:()=>rank()>=2,bank:()=>rank()>=1,apply:()=>rank()>=3,team:()=>rank()>=3,owner:()=>rank()>=4};
/* aprovações exigidas pela política (D59): quem cria nunca aprova */
function needAppr(r,usd){if(single())return 0;const p=S.pol;let n=0;if(RANK[r]<2)n=Math.max(n,p.op);if(usd>=p.thr)n=Math.max(n,p.big);return n;}
const apprOf=t=>t.appr||[];
const leftAppr=t=>single()?1:Math.max(0,(t.need||0)-apprOf(t).length);
const isMine=t=>t.by===me().name;
function canApprove(t){return t.status==='Awaiting approval'&&can.approve()&&(single()||(!isMine(t)&&!apprOf(t).some(a=>a.name===me().name)));}
function canConfirmReady(t){return t.status==='Ready to confirm'&&can.approve()&&(single()||isMine(t));}
function canCancelTx(t){if(t.kind!=='payment')return PRE.includes(t.status)&&can.send();if(t.status==='Processing')return can.approve();return PRE.includes(t.status)&&can.pay()&&(isMine(t)||can.approve());}
const isNewBen=b=>!!(b&&b.added)&&(new Date(TODAY+'T12:00')-new Date(b.added.at))/864e5<=30;
const newBenNote=b=>isNewBen(b)?'<div class="note note-warn" role="note" data-pt="D59">'+ic('alert')+'<span><b>'+(b.added.edit?'Bank details changed.':'New beneficiary.')+'</b> '+(b.added.edit?'Changed':'Added')+' by '+esc(b.added.by)+' on '+fds(b.added.at)+'. Check the bank details before you approve.</span></div>':'';
const apprTxt=n=>n===0?'None':n+' approval'+(n>1?'s':'');
const me=()=>USERS[role()];
const single=()=>S.who==='single';
const feePct=()=>nf(FEE*100)+'%';
function methodOf(b){const L=METHODS[b.country]||[];return L.find(x=>x.m===b.m&&(x.rail||'')===(b.rail||'')&&x.cur===b.cur)||L.find(x=>x.m===b.m&&(x.rail||'')===(b.rail||''))||null;}
function pfOf(b){const m=methodOf(b);return m?m.pf:(b.m==='SWIFT'?40:5);}
const ttot=t=>r2(t.usd+(t.fee||0)+(t.pf||0)+(t.our||0));
const txFees=t=>DONE_BAD.includes(t.status)||PRE.includes(t.status)?0:r2((t.fee||0)+(t.pf||0));
const moreTxt=n=>n+' more approval'+(n>1?'s':'');
const benOk=t=>t.kind!=='payment'||(ben(t.ben)||{}).status==='Active';
/* reservado: pagamentos confirmados e envios ainda não liquidados (P24) */
const reserved=()=>r2(S.txs.filter(t=>t.status==='Processing'&&(t.kind==='payment'||t.kind==='withdraw'||(t.kind==='internal'&&t.dir==='out'))).reduce((a,t)=>a+ttot(t),0));
const needsReview=(b,usd)=>!b.wl||usd>b.cap;
const hid=v=>S.hideBal?'••••••':v;
function monthStats(){
  const pays=S.txs.filter(t=>t.kind==='payment'&&t.at.slice(0,7)==='2026-09'&&['Sent','Credited'].includes(t.status));
  const prog=S.txs.filter(t=>t.kind==='payment'&&(t.status==='Processing'||t.status==='Sent'));
  return {paid:r2(pays.reduce((a,t)=>a+t.usd,0)),paidN:pays.length,
    prog:r2(prog.reduce((a,t)=>a+t.usd,0)),progN:prog.length,rev:S.txs.filter(t=>t.status==='In review').length,
    ready:S.bens.filter(b=>b.status==='Active').length,upd:S.bens.filter(b=>b.status==='Needs update').length};
}
function calc(){
  const p=S.pay,b=ben(p.ben);if(!b)return null;
  const v=parseAmt(p.amt),rate=RATES[b.cur];let usd=0,dest=0;
  if(!isNaN(v)&&v>0){if(b.cur==='USD'||p.mode==='usd'){usd=r2(v);dest=r2(v*rate);}else{dest=r2(v);usd=r2(v/rate);}}
  const fee=r2(usd*FEE),pf=usd>0?pfOf(b):0,total=r2(usd+fee+pf),av=avail();
  return {b,v,rate,usd,dest,fee,pf,total,av,rev:usd>0&&needsReview(b,usd),need:usd>0?needAppr(role(),usd):0,valid:usd>0,insuf:usd>0&&total>av,bad:p.amt!==''&&(isNaN(v)||v<=0)};
}
/* caminho da revisão: confirmar agora, revisão de compliance (P23) ou aprovação (P25) */
function payPath(c){if(c.rev)return 'review';if(c.need>0)return 'approval';return 'confirm';}
const orv=id=>ORV_CLIENTS.find(o=>o.id===id);
function txAsset(t){const w=t.wid?wal(t.wid):null;return {asset:t.asset||(w?w.asset:'USDC'),net:t.net||(w?w.net:'ethereum')};}
function txParty(t){return mParty(t);}
function txPartyOld(t){
  if(t.kind==='payment'){const b=ben(t.ben);return {who:b.name,sub:b.bank+' · '+COUNTRY[b.country],method:methodLabel(b)};}
  if(t.kind==='internal'){const o=orv(t.party),a=txAsset(t);return {who:o.name,sub:'Orval ID '+o.oid,method:'On-chain · '+NET[a.net].name,crypto:a};}
  if(t.kind==='withdraw'||t.via==='crypto'){const a=txAsset(t);return {who:'External wallet',sub:short(t.addr),method:a.asset+' · '+NET[a.net].name,crypto:a};}
  return {who:'Bank transfer ('+(t.cur||'USD')+')',sub:t.from,method:'Bank transfer'};
}
const txSign=t=>(t.kind==='deposit'||(t.kind==='internal'&&t.dir==='in'))?1:-1;
const txType=t=>t.kind==='payment'?'Payment':t.kind==='withdraw'?'Withdrawal':t.kind==='internal'?'Internal transfer':'Deposit';

function txIco(t){const bad=DONE_BAD.includes(t.status),inn=txSign(t)>0;return '<span class="tico '+(bad?'ti-bad':(inn?'ti-in':'ti-out'))+'">'+ic(t.kind==='internal'?'swap':(t.kind==='deposit'?'down':(t.kind==='withdraw'?'pay':'up')),16)+'</span>';}
function amtCell(t){
  const sign=txSign(t),bad=DONE_BAD.includes(t.status);
  if(isUsdtDep(t))return '<span class="amt-in">'+money(t.conv.usdc,'USD',{sign:true})+'</span><span class="sub">From USDT '+nf(t.usd,0)+'</span>';
  if(PRE.includes(t.status))return '<span class="muted">'+money(-t.usd)+'</span><span class="sub">Not charged yet</span>';
  return '<span class="'+(bad?'muted':(sign>0?'amt-in':'amt-out'))+'">'+money(sign*t.usd,'USD',{sign:true})+'</span>'+(bad?'<span class="sub">'+(t.status==='Cancelled'&&!t.wasConf?'Not charged':'Back in balance')+'</span>':(t.kind==='payment'&&t.cur!=='USD'?'<span class="sub" title="Amount the beneficiary receives">'+money(t.dest,t.cur,{code:true})+'</span>':''));
}

/* ===================== Detalhe da transação e acompanhamento ===================== */
function payStages(t){
  const b=ben(t.ben),sw=b.m==='SWIFT',conv=t.cur!=='USD',st=t.st||{},A=apprOf(t),need=t.need||0,pre=t.rev||need>0;
  const waiting=PRE.includes(t.status)||(t.status==='Cancelled'&&!t.wasConf);
  const L=[{t:'Payment created'+(t.by?' by '+t.by:''),s:!pre?'Confirmed with an authenticator code. Funds reserved from your balance.':(waiting?'Not charged yet. Nothing leaves your balance until it is confirmed.':'Sent for '+(t.rev?'review':'approval')+'. Charged only when confirmed.'),at:st.created}];
  if(t.rev)L.push({t:'Compliance review',s:st.reviewed?'Approved by Orval compliance.':'Orval compliance reviews payments to new beneficiaries and larger amounts.',at:st.reviewed||null});
  if(need>0){const left=Math.max(0,need-A.length);L.push({t:'Approvals ('+A.length+' of '+need+')',s:(A.length?'Approved by '+A.map(a=>a.name).join(', ')+'. ':'')+(left?'Waiting for '+moreTxt(left)+' from a Treasury Manager, Admin or Owner. The last one confirms with the final rate.':'Confirmed with the final rate. Funds reserved.'),at:left?null:(st.confirmed||A[A.length-1].at)});}
  else if(t.rev)L.push({t:'Confirmed',s:st.confirmed?'With the final rate. Funds reserved.':'The person who created it confirms with the final rate and an authenticator code.',at:st.confirmed||null});
  if(t.status==='Cancelled'){const L2=L.filter(x=>x.at);L2.push({t:'Cancelled',s:t.wasConf?'Cancelled before it was sent. '+money(ttot(t))+' went back to your balance.':'Cancelled before it was confirmed. Nothing left your balance.',at:st.cancelled,bad:1});L2.forEach(x=>{x.state=x.bad?'bad':'done';});return L2;}
  L.push({t:conv?'Converted':'Prepared for payout',s:conv?money(t.usd)+' converted to '+money(t.dest,t.cur,{code:true})+' at '+rateTextFor(t.cur,t.rate):money(t.usd)+' ready to send',at:st.converted},
    {t:'Sent to '+b.bank,s:sw?'Via SWIFT. Tracking number (UETR) assigned.':'Via local transfer'+(b.rail?' ('+b.rail+')':'')+'.',at:st.sent});
  if(t.status==='Returned')L.push({t:'Returned by the bank',s:(t.reason||'Returned')+'. '+money(t.usd)+' and the fees are back in your balance.',at:st.returned,bad:1});
  else L.push({t:'Credited',s:'The beneficiary\'s bank confirmed the credit. Your team gets an email.',at:st.credited});
  let cur=false;L.forEach(x=>{if(x.bad)x.state='bad';else if(x.at)x.state='done';else if(!cur){x.state='cur';cur=true;}else x.state='todo';});
  return L;
}
function tl(L){return '<ol class="tl">'+L.map(x=>'<li class="'+x.state+'"><span class="dot">'+(x.state==='done'?ic('check',14):(x.state==='bad'?ic('x',14):''))+'</span><div><b>'+esc(x.t)+'</b><div class="tl-s">'+esc(x.s)+'</div></div><time>'+(x.at?fds(x.at)+', '+ft(x.at):(x.state==='cur'?'In progress':''))+'</time></li>').join('')+'</ol>';}
/* ação de um pagamento antes da confirmação (P23, P25) */

    '<button type="submit" class="btn btn-primary btn-lg btn-block mt16"'+(S.tries>0&&q.code.replace(/\D/g,'').length===6?'':' disabled')+'>'+ic('check',16)+'Approve ('+(A.length+1)+' of '+t.need+')</button>'+
    '<div class="mt16">'+proto('Qualquer código de 6 dígitos aprova; 000000 simula código errado.')+'</div></form></section>';
  const f=confirmForm({submit:'txConfirm',tid:t.id,title:ready?'Confirm with your authenticator':'Approve with your authenticator',until:q.until,code:q.code,err:q.err,bind:'cq.code',id:'cq-code',label:ready?'Confirm and pay':(single()?'Pay and approve':'Approve and pay'),total,dest:t.dest,cur:t.cur,refresh:'cqRefresh',expire:'cqExpire'});
  return '<section class="card" data-pt="P25 D59">'+f.replace('<h2 class="cf-h">','<h2 class="cf-h">').replace('</h2>','</h2>'+(ready?'':status)+newBenNote(b).replace('class="note','class="note mt12'))+'</section>';

const hlCur=t=>t.kind==='payment'||t.kind==='bank'?t.cur:(t.kind==='deposit'&&t.via==='bank'?(t.cur||'USD'):txAsset(t).asset);

  const lab={per:'Date range',type:'Type',cur:'Currency',m:'Method',st:'Status'},on=k=>f[k]&&f[k]!=='all';

function txFiltered(){
  const f=S.txf,q=f.q.trim().toLowerCase();
  return allTxs().filter(t=>{
    if(f.chip==='progress'&&!PROG.includes(t.status))return false;
    if(f.chip==='done'&&!['Credited','Completed'].includes(t.status))return false;
    if(f.chip==='failed'&&!DONE_BAD.includes(t.status))return false;
    if(f.type!=='all'&&t.kind!==f.type)return false;
    if(f.cur!=='all'&&(t.kind==='payment'||t.kind==='bank'?t.cur:'USD')!==f.cur)return false;
    if(!inPeriod(t.at,f.per))return false;
    if(q){const p=t.kind==='bank'?{who:t.party,sub:'Banking account '+t.method}:txParty(t);const hay=[p.who,p.sub,t.ref,t.uetr,t.track,t.addr,t.hash,t.asset].join(' ').toLowerCase();if(!hay.includes(q))return false;}
    return true;});
}

function ibanOk(v,country){const s=v.replace(/\s+/g,'').toUpperCase();if(!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(s))return 'Enter a valid IBAN';if(country&&s.slice(0,2)!==country)return 'This IBAN is not from '+COUNTRY[country];if(IBAN_LEN[s.slice(0,2)]&&s.length!==IBAN_LEN[s.slice(0,2)])return 'IBANs from '+COUNTRY[s.slice(0,2)]+' have '+IBAN_LEN[s.slice(0,2)]+' characters';const r=(s.slice(4)+s.slice(0,4)).replace(/[A-Z]/g,c=>String(c.charCodeAt(0)-55));let m=0;for(const ch of r)m=(m*10+Number(ch))%97;return m===1?'':'This IBAN has a typo (check digits do not match)';}
